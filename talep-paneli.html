<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şube Talepleri Paneli</title>
<style>
  :root{--ink:#111827;--paper:#F8F7F4;--brass:#B45309;--line:#E5E2DA;--muted:#6B7280;--total:#FEF3C7;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:20px;margin:0 0 4px;}
  h2.kategori-baslik{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);background:#FAFAF8;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=date]{padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit;}
  button{padding:11px 18px;background:var(--ink);color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  .durum{margin:14px 0;padding:12px;border-radius:10px;font-size:14px;display:none;}
  .durum.hata{display:block;background:#FEF2F2;color:#991B1B;}
  .durum.bos{display:block;background:#fff;border:1px solid var(--line);color:var(--muted);}
  .kart{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;}
  thead th{background:#FAFAF8;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;}
  tbody tr:last-child td{border-bottom:0;}
  tr.toplam-satir td{font-weight:700;background:var(--total);}
  td.toplam-sutun{font-weight:700;background:#FAFAF8;}
  .tablo-scroll{overflow-x:auto;}
  .notlar{padding:16px 18px;}
  .notlar h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .not-satir{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);}
  .not-satir:last-child{border-bottom:0;}
  .not-sube{font-weight:600;}
  .ozet-kart{padding:14px 16px;}
  .ozet-kart h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .ozet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
  .ozet-hucre{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;}
  .ozet-hucre b{font-variant-numeric:tabular-nums;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Şube Talepleri Paneli</h1>
  <div class="sub">Şubelerin gönderdiği ürün taleplerinin, seçili tarih aralığı için özeti.</div>

  <div class="toolbar">
    <div>
      <label for="baslangic">Başlangıç</label>
      <input type="date" id="baslangic">
    </div>
    <div>
      <label for="bitis">Bitiş</label>
      <input type="date" id="bitis">
    </div>
    <button id="yenile">Yenile</button>
    <button id="indir">CSV İndir</button>
    <button id="indirOrijinal">Orijinal Formatında İndir (.xlsx)</button>
  </div>

  <div class="durum" id="durum"></div>
  <div id="icerik"></div>
</div>

<script>
// ---- AYARLAR: sube-talep.html ile AYNI Apps Script URL'sini kullan ----
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqY8TfdzTGWmtvrHZMseK8L3UWDFH1EEgZVESD7q8HUdODGU6YtAWb45-M7aA9aQ81aw/exec";

// Kategori gösterim sırası (sube-talep.html'deki KATALOG ile aynı sıra)
const KATEGORI_SIRASI = ["Tek Pastalar (Fransız)", "Fransız Ekler", "Dilim Cheesecake", "Bütün Cheesecake", "Klasik Pastalar (Boylu)", "Tatlı Kurabiyeler", "Unsuz / Diyet Ürünler", "Kekler", "Börekli Taş & Poğaça Grubu", "Galeta / Kıtır / Cips / Diğer Tuzlu", "Porsiyon Tatlılar"];

// Orijinal "Sipariş listesi" dosyasının sayfa yapısı (Orijinal Formatında İndir için).
// tip: "basit"  -> ÜRÜNLER | şube1 | şube2 | ... | TOPLAM(ADET)   (Pasta Fransız, Tek Pasta Klasik)
// tip: "giden"  -> ÜRÜNLER | şube1 | GİDEN | şube2 | GİDEN | ... | TOPLAM ADET   (Tatlı/Tuzlu Kurabiye)
// tip: "boylu"  -> ÜRÜNLER | şube1 (boy 0-3) | şube2 (boy 0-3) | ... | TOPLAM ADET (boy 0-3)  (Pasta Klasik)
const SAYFA_TANIMLARI = [
  { ad: "PASTA FRANSIZ", tip: "basit", toplamEtiket: "TOPLAM",
    kategoriler: ["Tek Pastalar (Fransız)", "Fransız Ekler", "Dilim Cheesecake", "Bütün Cheesecake"] },
  { ad: "PASTA KLASİK", tip: "boylu", toplamEtiket: "TOPLAM ADET",
    kategoriler: ["Klasik Pastalar (Boylu)"] },
  { ad: "TATLI KURABİYE 1", tip: "giden", toplamEtiket: "TOPLAM ADET",
    kategoriler: ["Tatlı Kurabiyeler", "Unsuz / Diyet Ürünler", "Kekler"] },
  { ad: "TUZLU KURABİYE 2", tip: "giden", toplamEtiket: "TOPLAM ADET",
    kategoriler: ["Börekli Taş & Poğaça Grubu", "Galeta / Kıtır / Cips / Diğer Tuzlu"] },
  { ad: "TEK PASTA KLASİK", tip: "basit", toplamEtiket: "TOPLAM ADET",
    kategoriler: ["Porsiyon Tatlılar"] },
];
const GUN_ADLARI = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

// Orijinal dosyadaki şube sırası (alfabetik değil) — tüm sayfa/tablolarda bu sıra kullanılır.
const SUBE_SIRASI = ["Nişantaşı", "Fulya", "Maslak", "Kireçburnu", "S.beyli", "Z.burnu", "Beykent"];

// Pasta Klasik'te her şubenin sunduğu boy (0-3) aralığı, orijinal dosyaya göre.
// Listede olmayan bir şube gelirse (beklenmedik durum) Boy 0-1 varsayılır.
const KLASIK_PASTA_BOYLARI = {
  "Nişantaşı": ["0", "1", "2"],
  "Fulya": ["0", "1", "2"],
  "Maslak": ["0", "1", "2", "3"],
  "Kireçburnu": ["0", "1"],
  "S.beyli": ["0", "1"],
  "Z.burnu": ["0", "1"],
  "Beykent": ["0", "1"],
};

function subeSirala(subeler) {
  return [...subeler].sort((a, b) => {
    const ia = SUBE_SIRASI.indexOf(a), ib = SUBE_SIRASI.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b, "tr");
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}
// -------------------------------------------------------------------

const baslangicInput = document.getElementById("baslangic");
const bitisInput = document.getElementById("bitis");
const durumEl = document.getElementById("durum");
const icerikEl = document.getElementById("icerik");
const yenileBtn = document.getElementById("yenile");
const indirBtn = document.getElementById("indir");
const indirOrijinalBtn = document.getElementById("indirOrijinal");

const yarin = new Date();
yarin.setDate(yarin.getDate() + 1);
baslangicInput.value = yarin.toISOString().slice(0, 10);
bitisInput.value = yarin.toISOString().slice(0, 10);

baslangicInput.addEventListener("change", ciz);
bitisInput.addEventListener("change", ciz);
yenileBtn.addEventListener("click", yukleVeCiz);
indirBtn.addEventListener("click", csvIndir);
indirOrijinalBtn.addEventListener("click", orijinalFormattaIndir);

let TUM_KAYITLAR = [];
let SON_GORUNTULENEN = [];

yukleVeCiz();

async function yukleVeCiz() {
  if (APPS_SCRIPT_URL.includes("BURAYA_")) {
    goster("hata", "Kurulum tamamlanmadı: APPS_SCRIPT_URL henüz ayarlanmamış.");
    return;
  }
  yenileBtn.disabled = true;
  yenileBtn.textContent = "Yükleniyor...";
  gizle();
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    TUM_KAYITLAR = data.kayitlar || [];
    ciz();
  } catch (err) {
    goster("hata", "Veriler yüklenemedi, internet bağlantınızı kontrol edip tekrar deneyin.");
  } finally {
    yenileBtn.disabled = false;
    yenileBtn.textContent = "Yenile";
  }
}

function urunEtiketi(kayit) {
  return kayit.boy !== "" && kayit.boy !== undefined && kayit.boy !== null
    ? `${kayit.urun} (Boy ${kayit.boy})`
    : kayit.urun;
}

function ciz() {
  const bas = baslangicInput.value;
  const bit = bitisInput.value || bas;
  const araliktakiKayitlar = TUM_KAYITLAR.filter(k => k.tarih >= bas && k.tarih <= bit);
  const talepler = araliktakiKayitlar.filter(k => k.urun !== "NOT");
  const notlar = araliktakiKayitlar.filter(k => k.urun === "NOT");
  SON_GORUNTULENEN = talepler;

  icerikEl.innerHTML = "";

  if (talepler.length === 0 && notlar.length === 0) {
    goster("bos", "Bu tarih aralığı için henüz talep gönderilmedi.");
    return;
  }
  gizle();

  if (talepler.length > 0) {
    icerikEl.appendChild(kategoriOzetiOlustur(talepler));

    const kategoriler = [...new Set(talepler.map(t => t.kategori))]
      .sort((a, b) => {
        const ia = KATEGORI_SIRASI.indexOf(a), ib = KATEGORI_SIRASI.indexOf(b);
        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
      });
    kategoriler.forEach(kategori => {
      const kategoriKayitlari = talepler.filter(t => t.kategori === kategori);
      icerikEl.appendChild(pivotTablosuOlustur(kategori, kategoriKayitlari));
    });
  }
  if (notlar.length > 0) {
    icerikEl.appendChild(notlarKartiOlustur(notlar));
  }
}

function kategoriOzetiOlustur(talepler) {
  const kart = document.createElement("div");
  kart.className = "kart ozet-kart";
  const toplamlar = {};
  talepler.forEach(t => {
    toplamlar[t.kategori] = (toplamlar[t.kategori] || 0) + Number(t.miktar || 0);
  });
  const kategoriler = Object.keys(toplamlar).sort((a, b) => {
    const ia = KATEGORI_SIRASI.indexOf(a), ib = KATEGORI_SIRASI.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });
  let html = "<h2>Kategori Özeti</h2><div class=\"ozet-grid\">";
  kategoriler.forEach(k => {
    html += `<div class="ozet-hucre"><span>${k}</span><b>${toplamlar[k]}</b></div>`;
  });
  html += "</div>";
  kart.innerHTML = html;
  return kart;
}

function pivotTablosuOlustur(kategoriAdi, talepler) {
  const subeler = subeSirala([...new Set(talepler.map(t => t.sube))]);
  const urunEtiketleri = [...new Set(talepler.map(urunEtiketi))];
  const birimler = {};
  const grid = {};
  talepler.forEach(t => {
    const etiket = urunEtiketi(t);
    grid[etiket + "|" + t.sube] = (grid[etiket + "|" + t.sube] || 0) + Number(t.miktar || 0);
    birimler[etiket] = t.birim;
  });

  const kart = document.createElement("div");
  kart.className = "kart";
  const baslik = document.createElement("h2");
  baslik.className = "kategori-baslik";
  baslik.textContent = kategoriAdi;
  kart.appendChild(baslik);

  const scrollWrap = document.createElement("div");
  scrollWrap.className = "tablo-scroll";

  let html = "<table><thead><tr><th>Ürün</th>";
  subeler.forEach(s => (html += `<th>${s}</th>`));
  html += "<th>Toplam</th></tr></thead><tbody>";

  urunEtiketleri.forEach(etiket => {
    const birim = birimler[etiket] ? ` <span style="color:var(--muted);font-weight:400;">(${birimler[etiket]})</span>` : "";
    html += `<tr><td>${etiket}${birim}</td>`;
    let satirToplam = 0;
    subeler.forEach(sube => {
      const miktar = grid[etiket + "|" + sube] || 0;
      satirToplam += miktar;
      html += `<td>${miktar ? miktar : "–"}</td>`;
    });
    html += `<td class="toplam-sutun">${satirToplam}</td></tr>`;
  });

  html += `<tr class="toplam-satir"><td>Şube Toplamı</td>`;
  let genelToplam = 0;
  subeler.forEach(sube => {
    let subeToplam = 0;
    urunEtiketleri.forEach(etiket => (subeToplam += grid[etiket + "|" + sube] || 0));
    genelToplam += subeToplam;
    html += `<td>${subeToplam}</td>`;
  });
  html += `<td class="toplam-sutun">${genelToplam}</td></tr>`;
  html += "</tbody></table>";

  scrollWrap.innerHTML = html;
  kart.appendChild(scrollWrap);
  return kart;
}

function notlarKartiOlustur(notlar) {
  const kart = document.createElement("div");
  kart.className = "kart notlar";
  let html = "<h2>Şube Notları</h2>";
  notlar.forEach(n => {
    html += `<div class="not-satir"><span class="not-sube">${n.sube}:</span> ${n.miktar}</div>`;
  });
  kart.innerHTML = html;
  return kart;
}

function csvAlaniKac(deger) {
  const s = String(deger === undefined || deger === null ? "" : deger);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvIndir() {
  if (SON_GORUNTULENEN.length === 0) {
    goster("hata", "İndirilecek veri yok, önce bir tarih aralığı seçin.");
    return;
  }
  const basliklar = ["Tarih", "Şube", "Kategori", "Ürün", "Boy", "Miktar", "Birim"];
  const satirlar = [basliklar.join(",")];
  SON_GORUNTULENEN.forEach(k => {
    satirlar.push([
      k.tarih, k.sube, k.kategori, k.urun,
      k.boy !== undefined && k.boy !== null ? k.boy : "",
      k.miktar, k.birim,
    ].map(csvAlaniKac).join(","));
  });
  const csv = "﻿" + satirlar.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `sube-talepleri_${baslangicInput.value}_${bitisInput.value}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Orijinal dosyadaki renkler: şube/GİDEN/boy başlıkları kırmızı, kategori
// başlık satırları sarı, TOPLAM(ADET) sütunu açık gri (orijinalde tema
// rengi kullanılıyor, tam karşılığı olmadığı için düz griyle yaklaştırıldı).
const RENK_SUBE = "FFFF0000";
const RENK_KATEGORI = "FFFFFF00";
const RENK_TOPLAM = "FFD9D9D9";
const INCE_KENAR = { style: "thin", color: { argb: "FFBFBFBF" } };

function hucreStil(cell, { fill, bold, kenarlik = true, hizalama } = {}) {
  if (fill) cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: fill } };
  if (bold !== undefined) cell.font = { bold };
  if (kenarlik) cell.border = { top: INCE_KENAR, left: INCE_KENAR, bottom: INCE_KENAR, right: INCE_KENAR };
  if (hizalama) cell.alignment = hizalama;
}

function ustBilgiEkle(ws, tarihGosterim, gunAdi) {
  const c1 = ws.getCell(1, 1);
  c1.value = "LA VİTA";
  c1.font = { bold: true };
  ws.getCell(1, 2).value = tarihGosterim;
  const c2 = ws.getCell(2, 1);
  c2.value = "GÜN:";
  c2.font = { bold: true };
  ws.getCell(2, 2).value = gunAdi;
}

async function orijinalFormattaIndir() {
  const tarih = baslangicInput.value;
  if (!tarih) {
    goster("hata", "Önce bir tarih seçin.");
    return;
  }
  const gununKayitlari = TUM_KAYITLAR.filter(k => k.tarih === tarih && k.urun !== "NOT");
  if (gununKayitlari.length === 0) {
    goster("hata", tarih + " için indirilecek talep yok.");
    return;
  }

  const [yil, ay, gun] = tarih.split("-").map(Number);
  const gunAdi = GUN_ADLARI[new Date(yil, ay - 1, gun).getDay()];
  const tarihGosterim = `${String(gun).padStart(2, "0")}.${String(ay).padStart(2, "0")}.${yil}`;

  indirOrijinalBtn.disabled = true;
  indirOrijinalBtn.textContent = "Hazırlanıyor...";

  try {
    const wb = new ExcelJS.Workbook();

    SAYFA_TANIMLARI.forEach(tanim => {
      const sayfaKayitlari = gununKayitlari.filter(k => tanim.kategoriler.includes(k.kategori));
      if (sayfaKayitlari.length === 0) return;

      const subeler = subeSirala([...new Set(sayfaKayitlari.map(k => k.sube))]);
      const ws = wb.addWorksheet(tanim.ad);

      if (tanim.tip === "boylu") {
        boyluSayfaOlustur(ws, tanim, sayfaKayitlari, subeler, tarihGosterim, gunAdi);
      } else if (tanim.tip === "giden") {
        gidenSayfaOlustur(ws, tanim, sayfaKayitlari, subeler, tarihGosterim, gunAdi);
      } else {
        basitSayfaOlustur(ws, tanim, sayfaKayitlari, subeler, tarihGosterim, gunAdi);
      }
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `siparis-listesi_${tarih}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } finally {
    indirOrijinalBtn.disabled = false;
    indirOrijinalBtn.textContent = "Orijinal Formatında İndir (.xlsx)";
  }
}

// Kategori sırasına göre, her kategori başlangıcında bir başlık satırı ekleyerek
// ({tip:"kategori"}) ve ardından o kategorideki ürünleri ({tip:"urun"}) sıralar.
function kategoriBazliUrunSirasi(tanim, kayitlar) {
  const sonuc = [];
  tanim.kategoriler.forEach(kategori => {
    const kategoriKayitlari = kayitlar.filter(k => k.kategori === kategori);
    if (kategoriKayitlari.length === 0) return;
    const urunler = [...new Set(kategoriKayitlari.map(k => k.urun))];
    sonuc.push({ tip: "kategori", ad: kategori });
    urunler.forEach(u => sonuc.push({ tip: "urun", ad: u }));
  });
  return sonuc;
}

// tip: "basit" -> ÜRÜNLER | şube1 | şube2 | ... | TOPLAM(ADET)
function basitSayfaOlustur(ws, tanim, kayitlar, subeler, tarihGosterim, gunAdi) {
  ustBilgiEkle(ws, tarihGosterim, gunAdi);
  const grid = {};
  kayitlar.forEach(k => {
    grid[k.urun + "|" + k.sube] = (grid[k.urun + "|" + k.sube] || 0) + Number(k.miktar || 0);
  });

  const headerRow = 3;
  const baslikCell = ws.getCell(headerRow, 1);
  baslikCell.value = "ÜRÜNLER";
  hucreStil(baslikCell, { bold: true });
  subeler.forEach((s, i) => {
    const c = ws.getCell(headerRow, 2 + i);
    c.value = s;
    hucreStil(c, { fill: RENK_SUBE, bold: true });
  });
  const toplamCol = 2 + subeler.length;
  const tCell = ws.getCell(headerRow, toplamCol);
  tCell.value = tanim.toplamEtiket;
  hucreStil(tCell, { fill: RENK_TOPLAM, bold: true });

  let r = headerRow + 1;
  kategoriBazliUrunSirasi(tanim, kayitlar).forEach(satirBilgi => {
    if (satirBilgi.tip === "kategori") {
      const c = ws.getCell(r, 1);
      c.value = satirBilgi.ad;
      hucreStil(c, { fill: RENK_KATEGORI, bold: true, kenarlik: false });
      r++;
      return;
    }
    const urun = satirBilgi.ad;
    const adCell = ws.getCell(r, 1);
    adCell.value = urun;
    hucreStil(adCell, {});
    let toplam = 0;
    subeler.forEach((sube, i) => {
      const miktar = grid[urun + "|" + sube] || 0;
      toplam += miktar;
      const c = ws.getCell(r, 2 + i);
      c.value = miktar || null;
      hucreStil(c, {});
    });
    const tc = ws.getCell(r, toplamCol);
    tc.value = toplam || null;
    hucreStil(tc, { bold: true });
    r++;
  });

  ws.getColumn(1).width = 32;
  for (let i = 2; i <= toplamCol; i++) ws.getColumn(i).width = 11;
}

// tip: "giden" -> ÜRÜNLER | şube1 | GİDEN | şube2 | GİDEN | ... | TOPLAM ADET
// GİDEN: üretim sonrası elle doldurulan, sistemin bilmediği boş bir sütun.
function gidenSayfaOlustur(ws, tanim, kayitlar, subeler, tarihGosterim, gunAdi) {
  ustBilgiEkle(ws, tarihGosterim, gunAdi);
  const grid = {};
  kayitlar.forEach(k => {
    grid[k.urun + "|" + k.sube] = (grid[k.urun + "|" + k.sube] || 0) + Number(k.miktar || 0);
  });

  const headerRow = 3;
  const baslikCell = ws.getCell(headerRow, 1);
  baslikCell.value = "ÜRÜNLER";
  hucreStil(baslikCell, { bold: true });

  let col = 2;
  const subeKolonu = {};
  subeler.forEach(s => {
    const c1 = ws.getCell(headerRow, col);
    c1.value = s;
    hucreStil(c1, { fill: RENK_SUBE, bold: true });
    const c2 = ws.getCell(headerRow, col + 1);
    c2.value = "GİDEN";
    hucreStil(c2, { fill: RENK_SUBE, bold: true });
    subeKolonu[s] = col;
    col += 2;
  });
  const toplamCol = col;
  const tCell = ws.getCell(headerRow, toplamCol);
  tCell.value = tanim.toplamEtiket;
  hucreStil(tCell, { fill: RENK_TOPLAM, bold: true });

  let r = headerRow + 1;
  kategoriBazliUrunSirasi(tanim, kayitlar).forEach(satirBilgi => {
    if (satirBilgi.tip === "kategori") {
      const c = ws.getCell(r, 1);
      c.value = satirBilgi.ad;
      hucreStil(c, { fill: RENK_KATEGORI, bold: true, kenarlik: false });
      r++;
      return;
    }
    const urun = satirBilgi.ad;
    const adCell = ws.getCell(r, 1);
    adCell.value = urun;
    hucreStil(adCell, {});
    let toplam = 0;
    subeler.forEach(sube => {
      const c0 = subeKolonu[sube];
      const miktar = grid[urun + "|" + sube] || 0;
      toplam += miktar;
      const mc = ws.getCell(r, c0);
      mc.value = miktar || null;
      hucreStil(mc, {});
      hucreStil(ws.getCell(r, c0 + 1), {});
    });
    const tc = ws.getCell(r, toplamCol);
    tc.value = toplam || null;
    hucreStil(tc, { bold: true });
    r++;
  });

  ws.getColumn(1).width = 32;
  for (let i = 2; i < toplamCol; i += 2) {
    ws.getColumn(i).width = 9;
    ws.getColumn(i + 1).width = 8;
  }
  ws.getColumn(toplamCol).width = 12;
}

// tip: "boylu" -> ÜRÜNLER | şube1 (Boy 0-3) | şube2 (Boy 0-3) | ... | TOPLAM ADET (NO:0-3)
function boyluSayfaOlustur(ws, tanim, kayitlar, subeler, tarihGosterim, gunAdi) {
  ustBilgiEkle(ws, tarihGosterim, gunAdi);
  const TUM_BOYLAR = ["0", "1", "2", "3"];
  // Varsayılan boy sütunlarına ek olarak, şube o gün normalde sunmadığı bir boy
  // için talep girmişse (form hepsine aynı 0-3 alanını gösteriyor) o veri
  // kaybolmasın diye gerçek gönderilen boylar da sütunlara dahil edilir.
  const subeBoylari = {};
  subeler.forEach(s => {
    const varsayilan = KLASIK_PASTA_BOYLARI[s] || ["0", "1"];
    const gercekBoylar = kayitlar
      .filter(k => k.sube === s)
      .map(k => (k.boy !== undefined && k.boy !== null && k.boy !== "") ? String(k.boy) : "0");
    subeBoylari[s] = [...new Set([...varsayilan, ...gercekBoylar])].sort();
  });

  const grid = {};
  kayitlar.forEach(k => {
    const boy = k.boy !== undefined && k.boy !== null && k.boy !== "" ? String(k.boy) : "0";
    const anahtar = k.urun + "|" + k.sube + "|" + boy;
    grid[anahtar] = (grid[anahtar] || 0) + Number(k.miktar || 0);
  });

  const ustSatir = 3, altSatir = 4;
  const baslikCell = ws.getCell(ustSatir, 1);
  baslikCell.value = "ÜRÜNLER";
  hucreStil(baslikCell, { bold: true });

  let col = 2;
  const subeBaslangic = {};
  const ortaHizala = { horizontal: "center" };
  subeler.forEach(s => {
    const boylar = subeBoylari[s];
    const genislik = boylar.length;
    if (genislik > 1) ws.mergeCells(ustSatir, col, ustSatir, col + genislik - 1);
    for (let cc = col; cc <= col + genislik - 1; cc++) hucreStil(ws.getCell(ustSatir, cc), { fill: RENK_SUBE, bold: true, hizalama: ortaHizala });
    ws.getCell(ustSatir, col).value = s;
    subeBaslangic[s] = col;
    boylar.forEach((b, i) => {
      const bc = ws.getCell(altSatir, col + i);
      bc.value = b;
      hucreStil(bc, { fill: RENK_SUBE, bold: true, hizalama: ortaHizala });
    });
    col += genislik;
  });

  const toplamBaslangic = col;
  ws.mergeCells(ustSatir, toplamBaslangic, ustSatir, toplamBaslangic + 3);
  for (let cc = toplamBaslangic; cc <= toplamBaslangic + 3; cc++) hucreStil(ws.getCell(ustSatir, cc), { fill: RENK_TOPLAM, bold: true, hizalama: ortaHizala });
  ws.getCell(ustSatir, toplamBaslangic).value = tanim.toplamEtiket;
  TUM_BOYLAR.forEach((b, i) => {
    const bc = ws.getCell(altSatir, toplamBaslangic + i);
    bc.value = "NO:" + b;
    hucreStil(bc, { fill: RENK_TOPLAM, bold: true, hizalama: ortaHizala });
  });

  let r = altSatir + 1;
  kategoriBazliUrunSirasi(tanim, kayitlar).forEach(satirBilgi => {
    if (satirBilgi.tip === "kategori") {
      const c = ws.getCell(r, 1);
      c.value = satirBilgi.ad;
      hucreStil(c, { fill: RENK_KATEGORI, bold: true, kenarlik: false });
      r++;
      return;
    }
    const urun = satirBilgi.ad;
    const adCell = ws.getCell(r, 1);
    adCell.value = urun;
    hucreStil(adCell, {});
    const boyToplamlari = { "0": 0, "1": 0, "2": 0, "3": 0 };
    subeler.forEach(sube => {
      const c0 = subeBaslangic[sube];
      subeBoylari[sube].forEach((b, i) => {
        const miktar = grid[urun + "|" + sube + "|" + b] || 0;
        boyToplamlari[b] += miktar;
        const c = ws.getCell(r, c0 + i);
        c.value = miktar || null;
        hucreStil(c, {});
      });
    });
    TUM_BOYLAR.forEach((b, i) => {
      const c = ws.getCell(r, toplamBaslangic + i);
      c.value = boyToplamlari[b] || null;
      hucreStil(c, { bold: true });
    });
    r++;
  });

  ws.getColumn(1).width = 32;
  for (let i = 2; i < toplamBaslangic + 4; i++) ws.getColumn(i).width = 7;
}

function goster(tur, mesaj) {
  durumEl.className = "durum " + tur;
  durumEl.textContent = mesaj;
}
function gizle() {
  durumEl.className = "durum";
  durumEl.textContent = "";
}
