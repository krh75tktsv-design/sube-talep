<title>Şube Talepleri Paneli</title>
<style>
  :root{--ink:#111827;--paper:#F8F7F4;--brass:#B45309;--line:#E5E2DA;--muted:#6B7280;--total:#FEF3C7;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:20px;margin:0 0 4px;}
  h2.kategori-baslik{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);background:#FAFAF8;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=date]{padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit;}
  button{padding:11px 18px;background:var(--ink);color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
  button.ikincil{background:#0F9D58;color:#fff;border:0;}
  button:disabled{opacity:.5;cursor:default;}
  .durum{margin:14px 0;padding:12px;border-radius:10px;font-size:14px;display:none;}
  .durum.hata{display:block;background:#FEF2F2;color:#991B1B;}
  .durum.bos{display:block;background:#fff;border:1px solid var(--line);color:var(--muted);}
  .kart{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;}
  thead th{background:#FAFAF8;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;}
  tbody tr:last-child td{border-bottom:0;}
  tr.toplam-satir td{font-weight:700;background:var(--total);}
  td.toplam-sutun{font-weight:700;background:#FAFAF8;}
  .tablo-scroll{overflow-x:auto;}
  .notlar{padding:16px 18px;}
  .notlar h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .not-satir{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line);}
  .not-satir:last-child{border-bottom:0;}
  .not-sube{font-weight:600;}
  .ozet-kart{padding:14px 16px;}
  .ozet-kart h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .ozet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;}
  .ozet-hucre{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;}
  .ozet-hucre b{font-variant-numeric:tabular-nums;}

  /* --- Yazdırma görünümü: ekranda gizli, yazdırırken Excel'deki
         Üretim/Dağıtım sayfalarının aynısı, her biri ayrı A4 sayfasında. --- */
  #yazdirAlani{display:none;}
  @media print{
    @page{size:A4 landscape;margin:8mm;}
    body{background:#fff;}
    .wrap{display:none !important;}
    #yazdirAlani{display:block;}
    .yazdir-sayfa{page-break-after:always;break-after:page;}
    .yazdir-sayfa:last-child{page-break-after:auto;break-after:auto;}
    .yazdir-sayfa h2{font-size:13pt;margin:0 0 4mm;font-weight:700;}
    .yazdir-sayfa table{width:100%;border-collapse:collapse;table-layout:fixed;}
    .yazdir-sayfa th,.yazdir-sayfa td{border:1px solid #333;padding:2mm 1.5mm;text-align:center;
      word-wrap:break-word;overflow-wrap:anywhere;line-height:1.15;}
    .yazdir-sayfa th{background:#7F1D1D !important;color:#fff !important;font-weight:700;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .yazdir-sayfa th.toplam-bas{background:#1F2937 !important;}
    .yazdir-sayfa td.urun{text-align:left;}
    .yazdir-sayfa tr.kategori td{background:#FEF3C7 !important;font-weight:700;text-align:left;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .yazdir-sayfa td.toplam-h{background:#FEF9C3 !important;font-weight:700;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .yazdir-sayfa tr.genel td{background:#1F2937 !important;color:#fff !important;font-weight:700;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    /* Sütun sayısına göre punto: az sütunda çok büyük, çok sütunda sığacak kadar */
    .yazdir-sayfa.p-xl table{font-size:26pt;}
    .yazdir-sayfa.p-l  table{font-size:19pt;}
    .yazdir-sayfa.p-m  table{font-size:14pt;}
    .yazdir-sayfa.p-s  table{font-size:10.5pt;}
    .yazdir-sayfa.p-xs table{font-size:8pt;}
  }
</style>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3QXlRK-kL8QbolDkGhsXdhUlHkueKl6KvGS7T59SB8wMO6bYRELTRJwXePn5jQPZc9A/exec";

// Kategori gösterim sırası (sube-talep.html'deki KATALOG ile aynı sıra)
const KATEGORI_SIRASI = ["Tek Pastalar (Fransız)", "Fransız Ekler", "Dilim Cheesecake", "Bütün Cheesecake", "Klasik Pastalar (Boylu)", "Tatlı Kurabiyeler", "Kekler", "Börekli Taş & Poğaça Grubu", "Galeta / Kıtır / Cips / Diğer Tuzlu", "Porsiyon Tatlılar"];

const GUN_ADLARI = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

// Orijinal dosyadaki şube sırası (alfabetik değil) — tüm sayfa/tablolarda bu sıra kullanılır.
const SUBE_SIRASI = ["Nişantaşı", "Fulya", "Maslak", "Kireçburnu", "S.beyli", "Z.burnu", "Beykent"];

function subeSirala(subeler) {
  return [...subeler].sort((a, b) => {
    const ia = SUBE_SIRASI.indexOf(a), ib = SUBE_SIRASI.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b, "tr");
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

const baslangicInput = document.getElementById("baslangic");
const bitisInput = document.getElementById("bitis");
const durumEl = document.getElementById("durum");
const icerikEl = document.getElementById("icerik");

const indirBtn = document.getElementById("indir");

const indirZayiBtn = document.getElementById("indirZayi");
const yazdirBtn = document.getElementById("yazdir");

const yazdirAlaniEl = document.getElementById("yazdirAlani");

const yarin = new Date();
yarin.setDate(yarin.getDate() + 1);
baslangicInput.value = yarin.toISOString().slice(0, 10);
bitisInput.value = yarin.toISOString().slice(0, 10);

baslangicInput.addEventListener("change", ciz);
bitisInput.addEventListener("change", ciz);

let TUM_KAYITLAR = [];
let ZAYI_KAYITLARI = [];
let SON_GORUNTULENEN = [];

yukleVeCiz();

async function yukleVeCiz() {
  if (APPS_SCRIPT_URL.includes("BURAYA_")) {
    goster("hata", "Kurulum tamamlanmadı: APPS_SCRIPT_URL henüz ayarlanmamış.");
    return;
  }
  yenileBtn.disabled = true;
  yenileBtn.textContent = "Yükleniyor...";
  gizle();
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: "GET" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    // Adı değişen ürünlerin eski kayıtları yeni adla gösterilir; katalogdan
    // kaldırılan ürünler hiç gösterilmez.
    const hepsi = (data.kayitlar || [])
      .map(k => (URUN_ADI_ESKI_YENI[k.urun] ? { ...k, urun: URUN_ADI_ESKI_YENI[k.urun] } : k))
      .map(k => (BOYSUZ_URUNLER.has(k.urun) && k.boy !== "" ? { ...k, boy: "" } : k))
      .filter(k => !KALDIRILAN_URUNLER.has(k.urun));
    // Zayi kayıtları üretim/dağıtım raporundan tamamen ayrı tutulur.
    TUM_KAYITLAR = hepsi.filter(k => !zayiMi(k));
    ZAYI_KAYITLARI = hepsi.filter(zayiMi)
      .map(k => ({ ...k, kategori: String(k.kategori).slice(ZAYI_ONEK.length), boy: "" }));
    ciz();
  } catch (err) {
    goster("hata", "Veriler yüklenemedi, internet bağlantınızı kontrol edip tekrar deneyin.");
  } finally {
    yenileBtn.disabled = false;
    yenileBtn.textContent = "Yenile";
  }
}

const URUN_SAYFA = {};       // ürün -> rapor sayfası
const URUN_BOLUM = {};       // ürün -> sayfa içindeki bölüm
const URUN_SIRA_INDEX = {};  // ürün -> tablodaki genel sıra
const RAPOR_SAYFA_SIRASI = [];
const BOLUM_SIRASI = [];
RAPOR_DUZENI.forEach(([sayfa, bolum, urun], i) => {
  URUN_SAYFA[urun] = sayfa;
  URUN_BOLUM[urun] = bolum;
  URUN_SIRA_INDEX[urun] = i;
  if (!RAPOR_SAYFA_SIRASI.includes(sayfa)) RAPOR_SAYFA_SIRASI.push(sayfa);
  if (!BOLUM_SIRASI.includes(bolum)) BOLUM_SIRASI.push(bolum);
});

// Katalogdan kaldırılan ürünler: daha önce girilmiş kayıtlar da panelde ve
// raporda gösterilmez (Google E-Tablo'daki veriye dokunulmaz).
const KALDIRILAN_URUNLER = new Set([
  // Porsiyon Tatlılar'daki cheesecake'ler Dilim Cheesecake ile aynı ürünlerdi.
  "Frambuazlı Tek (Cheesecake)", "Limonlu Tek (Cheesecake)",

  "Batonsale Susamlı", "Batonsale Anasonlu", "Galet Anasonlu",
]);

// Boylu bir bölümde olsa da tek boy üretilen ürünler: raporda ve panelde
// boy kırılımına girmez, tek sütunda toplanır.
// Şube formundaki zayi bölümünden gelen kayıtlar kategorilerinde bu öneki taşır.
const ZAYI_ONEK = "ZAYİ · ";
function zayiMi(kayit) {
  return typeof kayit.kategori === "string" && kayit.kategori.startsWith(ZAYI_ONEK);
}

const BOYSUZ_URUNLER = new Set(["San Sebastian (Klasik)", "San Sebastian (Klasik) — Ekstra Sos"]);

// Ürün değil, şubenin işaretlediği bir istek olan satırlar: raporda görünür
// ama GENEL TOPLAM'a katılmaz (adet sayısını şişirmesin).
const ISTEK_URUNLERI = new Set(["San Sebastian (Klasik) — Ekstra Sos"]);

// Adı değişen ürünler: eski kayıtlar yeni adla gösterilir.
const URUN_ADI_ESKI_YENI = {
  "Çikolatalı Ekler (Fransız)": "Çikolatalı Ekler",
  "Frambuazlı Ekler (Fransız)": "Frambuazlı Ekler",
  "Limonlu Ekler (Fransız)": "Limonlu Ekler",
};

function urunBolumu(kayit) {
  return URUN_BOLUM[kayit.urun] || kayit.kategori;
}
function bolumSirala(bolumler) {
  return [...bolumler].sort((a, b) => {
    const ia = BOLUM_SIRASI.indexOf(a), ib = BOLUM_SIRASI.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });
}

// "Ürün (Boy 2)" gibi etiketlerde de temel ürün adına göre sıralar.
function urunSirala(etiketler) {
  return [...etiketler].sort((a, b) => {
    const ta = String(a).replace(/ \(Boy \d+\)$/, "");
    const tb = String(b).replace(/ \(Boy \d+\)$/, "");
    const ia = URUN_SIRA_INDEX[ta], ib = URUN_SIRA_INDEX[tb];
    const va = ia === undefined ? 99999 : ia;
    const vb = ib === undefined ? 99999 : ib;
    if (va !== vb) return va - vb;
    return String(a).localeCompare(String(b), "tr");
  });
}

function urunEtiketi(kayit) {
  return kayit.boy !== "" && kayit.boy !== undefined && kayit.boy !== null
    ? `${kayit.urun} (Boy ${kayit.boy})`
    : kayit.urun;
}

function ciz() {
  const bas = baslangicInput.value;
  const bit = bitisInput.value || bas;
  const araliktakiKayitlar = TUM_KAYITLAR.filter(k => k.tarih >= bas && k.tarih <= bit);
  const talepler = araliktakiKayitlar.filter(k => k.urun !== "NOT");
  const notlar = araliktakiKayitlar.filter(k => k.urun === "NOT");
  SON_GORUNTULENEN = talepler;

  icerikEl.innerHTML = "";

  if (talepler.length === 0 && notlar.length === 0) {
    goster("bos", "Bu tarih aralığı için henüz talep gönderilmedi.");
    return;
  }
  gizle();

  if (talepler.length > 0) {
    icerikEl.appendChild(kategoriOzetiOlustur(talepler));

    const kategoriler = [...new Set(talepler.map(t => t.kategori))]
      .sort((a, b) => {
        const ia = KATEGORI_SIRASI.indexOf(a), ib = KATEGORI_SIRASI.indexOf(b);
        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
      });
    kategoriler.forEach(kategori => {
      const kategoriKayitlari = talepler.filter(t => t.kategori === kategori);
      if (BOYLU_KATEGORILER.includes(kategori)) {
        icerikEl.appendChild(pivotTablosuBoyluOlustur(kategori, kategoriKayitlari));
      } else {
        icerikEl.appendChild(pivotTablosuOlustur(kategori, kategoriKayitlari));
      }
    });
  }
  if (notlar.length > 0) {
    icerikEl.appendChild(notlarKartiOlustur(notlar));
  }

  // Zayi bildirimleri ayrı bir kartta; üretim tablolarına karışmaz.
  const zayiler = ZAYI_KAYITLARI.filter(k => k.tarih >= bas && k.tarih <= bit);
  if (zayiler.length > 0) {
    const kart = pivotTablosuOlustur("Zayi Bildirimleri", zayiler);
    kart.querySelector(".kategori-baslik").style.background = "#FFF7ED";
    icerikEl.appendChild(kart);
  }
}

function kategoriOzetiOlustur(talepler) {
  const kart = document.createElement("div");
  kart.className = "kart ozet-kart";
  const toplamlar = {};
  talepler.forEach(t => {
    toplamlar[t.kategori] = (toplamlar[t.kategori] || 0) + Number(t.miktar || 0);
  });
  const kategoriler = Object.keys(toplamlar).sort((a, b) => {
    const ia = KATEGORI_SIRASI.indexOf(a), ib = KATEGORI_SIRASI.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });
  let html = "<h2>Kategori Özeti</h2><div class=\"ozet-grid\">";
  kategoriler.forEach(k => {
    html += `<div class="ozet-hucre"><span>${k}</span><b>${toplamlar[k]}</b></div>`;
  });
  html += "</div>";
  kart.innerHTML = html;
  return kart;
}

function pivotTablosuOlustur(kategoriAdi, talepler) {
  const subeler = subeSirala([...new Set(talepler.map(t => t.sube))]);
  const urunEtiketleri = urunSirala(new Set(talepler.map(urunEtiketi)));
  const birimler = {};
  const grid = {};
  talepler.forEach(t => {
    const etiket = urunEtiketi(t);
    grid[etiket + "|" + t.sube] = (grid[etiket + "|" + t.sube] || 0) + Number(t.miktar || 0);
    birimler[etiket] = t.birim;
  });

  const kart = document.createElement("div");
  kart.className = "kart";
  const baslik = document.createElement("h2");
  baslik.className = "kategori-baslik";
  baslik.textContent = kategoriAdi;
  kart.appendChild(baslik);

  const scrollWrap = document.createElement("div");
  scrollWrap.className = "tablo-scroll";

  let html = "<table><thead><tr><th>Ürün</th>";
  subeler.forEach(s => (html += `<th>${s}</th>`));
  html += "<th>Toplam</th></tr></thead><tbody>";

  urunEtiketleri.forEach(etiket => {
    const birim = birimler[etiket] ? ` <span style="color:var(--muted);font-weight:400;">(${birimler[etiket]})</span>` : "";
    html += `<tr><td>${etiket}${birim}</td>`;
    let satirToplam = 0;
    subeler.forEach(sube => {
      const miktar = grid[etiket + "|" + sube] || 0;
      satirToplam += miktar;
      html += `<td>${miktar ? miktar : "–"}</td>`;
    });
    html += `<td class="toplam-sutun">${satirToplam}</td></tr>`;
  });

  html += `<tr class="toplam-satir"><td>Şube Toplamı</td>`;
  let genelToplam = 0;
  subeler.forEach(sube => {
    let subeToplam = 0;
    urunEtiketleri.forEach(etiket => (subeToplam += grid[etiket + "|" + sube] || 0));
    genelToplam += subeToplam;
    html += `<td>${subeToplam}</td>`;
  });
  html += `<td class="toplam-sutun">${genelToplam}</td></tr>`;
  html += "</tbody></table>";

  scrollWrap.innerHTML = html;
  kart.appendChild(scrollWrap);
  return kart;
}

// Boylu kategoriler panelde şube başına Boy alt sütunlarıyla gösterilir
// (Excel raporundaki "- Dağıtım" sayfalarıyla aynı mantık), "Ürün (Boy X)"
// diye ayrı satırlara bölünmez.
const BOYLU_KATEGORILER = ["Klasik Pastalar (Boylu)", "Bütün Cheesecake"];
function kategoriSubeBoyKanonik(kategoriAdi, sube) {
  if (kategoriAdi === "Klasik Pastalar (Boylu)") return PASTA_KLASIK_SUBE_BOYLARI[sube] || [0];
  return [0, 1, 2];
}

function pivotTablosuBoyluOlustur(kategoriAdi, talepler) {
  const subeler = subeSirala([...new Set(talepler.map(t => t.sube))]);
  const boyDeger = t => (t.boy === "" || t.boy === undefined || t.boy === null ? 0 : Number(t.boy));
  const subeBoylari = {};
  subeler.forEach(sube => {
    const kanonik = kategoriSubeBoyKanonik(kategoriAdi, sube);
    const mevcut = talepler.filter(t => t.sube === sube).map(boyDeger);
    subeBoylari[sube] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
  });

  const urunler = urunSirala(new Set(talepler.map(t => t.urun)));
  const birimler = {};
  const grid = {};
  talepler.forEach(t => {
    const boy = boyDeger(t);
    const key = t.urun + "|" + t.sube + "|" + boy;
    grid[key] = (grid[key] || 0) + Number(t.miktar || 0);
    birimler[t.urun] = t.birim;
  });

  const kart = document.createElement("div");
  kart.className = "kart";
  const baslik = document.createElement("h2");
  baslik.className = "kategori-baslik";
  baslik.textContent = kategoriAdi;
  kart.appendChild(baslik);

  const scrollWrap = document.createElement("div");
  scrollWrap.className = "tablo-scroll";

  let html = '<table><thead><tr><th rowspan="2">Ürün</th>';
  subeler.forEach(sube => (html += `<th colspan="${subeBoylari[sube].length}">${sube}</th>`));
  html += '<th rowspan="2">Toplam</th></tr><tr>';
  subeler.forEach(sube => {
    subeBoylari[sube].forEach(boy => (html += `<th>Boy ${boy}</th>`));
  });
  html += "</tr></thead><tbody>";

  urunler.forEach(urun => {
    const birim = birimler[urun] ? ` <span style="color:var(--muted);font-weight:400;">(${birimler[urun]})</span>` : "";
    html += `<tr><td>${urun}${birim}</td>`;
    let satirToplam = 0;
    subeler.forEach(sube => {
      subeBoylari[sube].forEach(boy => {
        const miktar = grid[urun + "|" + sube + "|" + boy] || 0;
        satirToplam += miktar;
        html += `<td>${miktar ? miktar : "–"}</td>`;
      });
    });
    html += `<td class="toplam-sutun">${satirToplam}</td></tr>`;
  });

  html += `<tr class="toplam-satir"><td>Şube Toplamı</td>`;
  let genelToplam = 0;
  subeler.forEach(sube => {
    let subeToplam = 0;
    subeBoylari[sube].forEach(boy => {
      urunler.forEach(urun => { subeToplam += grid[urun + "|" + sube + "|" + boy] || 0; });
    });
    genelToplam += subeToplam;
    html += `<td colspan="${subeBoylari[sube].length}">${subeToplam}</td>`;
  });
  html += `<td class="toplam-sutun">${genelToplam}</td></tr>`;
  html += "</tbody></table>";

  scrollWrap.innerHTML = html;
  kart.appendChild(scrollWrap);
  return kart;
}

function notlarKartiOlustur(notlar) {
  const kart = document.createElement("div");
  kart.className = "kart notlar";
  let html = "<h2>Şube Notları</h2>";
  notlar.forEach(n => {
    html += `<div class="not-satir"><span class="not-sube">${n.sube}:</span> ${n.miktar}</div>`;
  });
  kart.innerHTML = html;
  return kart;
}

function csvAlaniKac(deger) {
  const s = String(deger === undefined || deger === null ? "" : deger);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvIndir() {
  if (SON_GORUNTULENEN.length === 0) {
    goster("hata", "İndirilecek veri yok, önce bir tarih aralığı seçin.");
    return;
  }
  const basliklar = ["Tarih", "Şube", "Kategori", "Ürün", "Boy", "Miktar", "Birim"];
  const satirlar = [basliklar.join(",")];
  SON_GORUNTULENEN.forEach(k => {
    satirlar.push([
      k.tarih, k.sube, k.kategori, k.urun,
      k.boy !== undefined && k.boy !== null ? k.boy : "",
      k.miktar, k.birim,
    ].map(csvAlaniKac).join(","));
  });
  const csv = "﻿" + satirlar.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `sube-talepleri_${baslangicInput.value}_${bitisInput.value}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Üretim & Dağıtım Raporu: TAMAMEN SIFIRDAN, basit ve güvenilir bir Excel
// üretir (var olan bir şablon dosyası yüklenmez — birleştirilmiş hücre,
// otomatik filtre gibi Excel'i "bozuk" gösterebilecek riskli özellikler
// kullanılmaz). Ustalar TOPLAM sütununa bakıp ne kadar üretileceğini,
// dağıtım yapan çalışanlar şube sütunlarına bakıp nereye ne gideceğini
// tek bakışta görür. Her kategori kendi sayfasında.
const KATEGORI_SAYFA_ESLEME = {
  "Tek Pastalar (Fransız)": "Pasta Fransız",
  "Fransız Ekler": "Pasta Fransız",
  "Dilim Cheesecake": "Pasta Fransız",
  "Bütün Cheesecake": "Pasta Fransız",
  "Klasik Pastalar (Boylu)": "Pasta Klasik",
  "Tatlı Kurabiyeler": "Tatlı Kurabiye",
  "Kekler": "Tatlı Kurabiye",
  "Börekli Taş & Poğaça Grubu": "Tuzlu Kurabiye",
  "Galeta / Kıtır / Cips / Diğer Tuzlu": "Tuzlu Kurabiye",
  "Porsiyon Tatlılar": "Porsiyon Tatlılar",
};

// Hangi şubenin hangi boyları sattığı (ürün sırası RAPOR_DUZENI'den gelir).
const PASTA_KLASIK_SUBE_BOYLARI = {
  "Nişantaşı": [0, 1, 2],
  "Fulya": [0, 1, 2],
  "Maslak": [0, 1, 2, 3],
  "Kireçburnu": [0, 1],
  "S.beyli": [0, 1],
  "Z.burnu": [0, 1],
  "Beykent": [0, 1],
};

const BUTUN_CHEESECAKE_SUBE_BOYLARI = {
  "Nişantaşı": [0, 1, 2],
  "Fulya": [0, 1, 2],
  "Maslak": [0, 1, 2],
  "Kireçburnu": [0, 1, 2],
};

// Şube+boy sütunlu sayfa düzeni kullanan kategoriler, sayfa adına göre.
// Ürün listeleri RAPOR_DUZENI tablosundan türetilir, ayrıca tanımlanmaz.
const BOYLU_URUN_SIRALARI = {};
["Pasta Klasik", "Bütün Cheesecake"].forEach(ad => {
  BOYLU_URUN_SIRALARI[ad] = RAPOR_DUZENI
    .filter(([sayfa, bolum]) => sayfa === ad || bolum === ad)
    .map(([, , urun]) => urun);
});
const BOYLU_SUBE_BOYLARI = {
  "Pasta Klasik": PASTA_KLASIK_SUBE_BOYLARI,
  "Bütün Cheesecake": BUTUN_CHEESECAKE_SUBE_BOYLARI,
};

const RENK_SUBE_BASLIK = "FF7F1D1D";
const RENK_KATEGORI = "FFFEF3C7";
const RENK_TOPLAM_SATIR = "FF1F2937";
const RENK_TOPLAM_SUTUN = "FFFEF9C3";
const INCE_CIZGI = { style: "thin", color: { argb: "FFE5E7EB" } };

// Ustaya (üretim toplamı) ve dağıtım yapan çalışana (şube kırılımı) ayrı
// sayfa/çıktı gereken kategoriler. Bu 3 kategori için sayfa "- Üretim" ve
// "- Dağıtım" olarak ikiye bölünür; diğerleri (Tatlı/Tuzlu Kurabiye) tek
// sayfada TOPLAM + şube sütunlarını birlikte göstermeye devam eder.
const SPLIT_KATEGORILER = ["Pasta Fransız", "Pasta Klasik", "Porsiyon Tatlılar"];
// Çıktı alındığında rahat okunsun diye bu 6 sayfada büyük punto/satır kullanılır.
const BUYUK_SATIR_YUKSEKLIGI = 90;
const BUYUK_PUNTO = 42;

// Sayfaya göre punto / satır yüksekliği. Kullanıcı çıktı üzerinde her sayfa
// için ayrı değer belirtti; burada tanımlı olmayan sayfalar varsayılanı kullanır.
// Punto, satır yüksekliği, sütun genişlikleri ve kağıt yönü — hepsi
// kullanıcının düzenleyip gönderdiği örnek rapor dosyasından alındı.
// urunGen: ÜRÜN sütunu, veriGen: sayı sütunları, ayirac: şube grupları
// arasına konan ince boş sütunun genişliği (0 = ayraç yok).
const SAYFA_BICIMI = {
  "Pasta Fransız - Üretim":     { punto: 42, yukseklik: 90, yon: "portrait",  urunGen: 110.5, veriGen: 32,
                                yanBlok: ["Dilim Cheesecake", "Bütün Cheesecake"], yanUrunGen: 102.5 },
  "Pasta Fransız - Dağıtım":    { punto: 55, yukseklik: 95, yon: "portrait",  urunGen: 157.5, veriGen: 58 },
  "Pasta Klasik - Üretim":      { punto: 42, yukseklik: 90, yon: "portrait",  urunGen: 90,    veriGen: 26.5 },
  "Pasta Klasik - Dağıtım":     { punto: 42, yukseklik: 90, yon: "landscape", urunGen: 90,    veriGen: 24, ayirac: 1.6 },
  "Tatlı Kurabiye":             { punto: 15, yukseklik: 35, yon: "portrait",  urunGen: 34,    veriGen: 12 },
  "Tuzlu Kurabiye":             { punto: 18, yukseklik: 35, yon: "portrait",  urunGen: 51,    veriGen: 12 },
  "Porsiyon Tatlılar - Üretim": { punto: 42, yukseklik: 90, yon: "portrait",  urunGen: 122,   veriGen: 32 },
  "Porsiyon Tatlılar - Dağıtım":{ punto: 42, yukseklik: 90, yon: "portrait",  urunGen: 122,   veriGen: 42.5 },
};
const VARSAYILAN_BICIM = {
  punto: BUYUK_PUNTO, yukseklik: BUYUK_SATIR_YUKSEKLIGI,
  yon: "portrait", urunGen: 110, veriGen: 32,
};
function sayfaBicimi(sayfaTamAdi) {
  return Object.assign({}, VARSAYILAN_BICIM, SAYFA_BICIMI[sayfaTamAdi] || {});
}

// Tek sayfaya sığdır; yön sayfaya göre değişir.
function sayfaYazdirmaAyarla(ws, yon) {
  ws.pageSetup = { orientation: yon || "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
}

function hucreStilVer(cell, { fill, bold, renk, boyut, hizalama, kenarlik = true } = {}) {
  if (fill) cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: fill } };
  const font = {};
  if (bold !== undefined) font.bold = bold;
  if (renk) font.color = { argb: renk };
  if (boyut) font.size = boyut;
  if (Object.keys(font).length) cell.font = font;
  if (hizalama) cell.alignment = hizalama;
  if (kenarlik) cell.border = { top: INCE_CIZGI, left: INCE_CIZGI, bottom: INCE_CIZGI, right: INCE_CIZGI };
}

async function uretimRaporuIndir() {
  const bas = baslangicInput.value;
  const bit = bitisInput.value || bas;
  if (!bas) {
    goster("hata", "Önce bir tarih seçin.");
    return;
  }
  const kayitlar = TUM_KAYITLAR.filter(k => k.tarih >= bas && k.tarih <= bit && k.urun !== "NOT");
  if (kayitlar.length === 0) {
    goster("hata", "Bu tarih aralığı için indirilecek talep yok.");
    return;
  }

  indirOrijinalBtn.disabled = true;
  indirOrijinalBtn.textContent = "Hazırlanıyor...";

  try {
    const wb = new ExcelJS.Workbook();
    const tarihBaslik = bas === bit ? bas : `${bas} — ${bit}`;

    RAPOR_SAYFA_SIRASI.forEach(sayfaAdi => {
      const sayfaKayitlari = kayitlar.filter(k => URUN_SAYFA[k.urun] === sayfaAdi);
      if (sayfaKayitlari.length === 0) return;
      if (BOYLU_URUN_SIRALARI[sayfaAdi]) {
        boyluUretimSayfasiOlustur(wb, sayfaAdi, sayfaKayitlari, tarihBaslik);
        boyluDagitimSayfasiOlustur(wb, sayfaAdi, sayfaKayitlari, tarihBaslik);
      } else if (SPLIT_KATEGORILER.includes(sayfaAdi)) {
        duzUretimSayfasiOlustur(wb, sayfaAdi, sayfaKayitlari, tarihBaslik);
        duzDagitimSayfasiOlustur(wb, sayfaAdi, sayfaKayitlari, tarihBaslik);
      } else {
        raporSayfasiOlustur(wb, sayfaAdi, sayfaKayitlari, tarihBaslik);
      }
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `uretim-dagitim-raporu_${bas}${bit !== bas ? "_" + bit : ""}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    goster("hata", "Dosya oluşturulamadı: " + err.message);
  } finally {
    indirOrijinalBtn.disabled = false;
    indirOrijinalBtn.textContent = "Üretim & Dağıtım Raporu (.xlsx)";
  }
}

function raporSayfasiOlustur(wb, sayfaAdi, kayitlar, tarihBaslik) {
  const ws = wb.addWorksheet(sayfaAdi.substring(0, 31));
  const subeler = subeSirala([...new Set(kayitlar.map(k => k.sube))]);
  const BC = sayfaBicimi(sayfaAdi);
  const BP = BC.punto, BY = BC.yukseklik;
  sayfaYazdirmaAyarla(ws, BC.yon);

  const ustBaslik = ws.getCell(1, 1);
  ustBaslik.value = `${sayfaAdi} — ${tarihBaslik}`;
  ustBaslik.font = { bold: true, size: 16 };
  ws.getRow(1).height = 26;

  const headerRow = 3;
  ws.getRow(headerRow).height = BY;
  const urunBaslik = ws.getCell(headerRow, 1);
  urunBaslik.value = "ÜRÜN";
  hucreStilVer(urunBaslik, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP });
  subeler.forEach((s, i) => {
    const c = ws.getCell(headerRow, 2 + i);
    c.value = s.toLocaleUpperCase("tr");
    hucreStilVer(c, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center" } });
  });
  const toplamCol = 2 + subeler.length;
  const toplamBaslik = ws.getCell(headerRow, toplamCol);
  toplamBaslik.value = "TOPLAM";
  hucreStilVer(toplamBaslik, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center" } });

  const grid = {};
  const birimler = {};
  kayitlar.forEach(k => {
    const etiket = urunEtiketi(k);
    grid[etiket + "|" + k.sube] = (grid[etiket + "|" + k.sube] || 0) + Number(k.miktar || 0);
    birimler[etiket] = k.birim;
  });

  const kategoriler = bolumSirala(new Set(kayitlar.map(urunBolumu)));

  let r = headerRow + 1;
  kategoriler.forEach(kategori => {
    const kategoriKayitlari = kayitlar.filter(k => urunBolumu(k) === kategori);
    const urunEtiketleri = urunSirala(new Set(kategoriKayitlari.map(urunEtiketi)));

    ws.getRow(r).height = BY;
    const kc = ws.getCell(r, 1);
    kc.value = kategori;
    hucreStilVer(kc, { fill: RENK_KATEGORI, bold: true, boyut: BP });
    for (let c = 2; c <= toplamCol; c++) {
      hucreStilVer(ws.getCell(r, c), { fill: RENK_KATEGORI });
    }
    r++;

    urunEtiketleri.forEach(etiket => {
      ws.getRow(r).height = BY;
      const ad = ws.getCell(r, 1);
      ad.value = etiket + (birimler[etiket] ? ` (${birimler[etiket]})` : "");
      hucreStilVer(ad, { boyut: BP });
      let toplam = 0;
      subeler.forEach((sube, i) => {
        const miktar = grid[etiket + "|" + sube] || 0;
        toplam += miktar;
        const c = ws.getCell(r, 2 + i);
        c.value = miktar || null;
        hucreStilVer(c, { boyut: BP, hizalama: { horizontal: "center" } });
      });
      const tc = ws.getCell(r, toplamCol);
      tc.value = toplam;
      hucreStilVer(tc, { bold: true, boyut: BP, fill: RENK_TOPLAM_SUTUN, hizalama: { horizontal: "center" } });
      r++;
    });
  });

  ws.getRow(r).height = BY;
  const genelToplamAd = ws.getCell(r, 1);
  genelToplamAd.value = "GENEL TOPLAM";
  hucreStilVer(genelToplamAd, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP });
  let genelToplam = 0;
  subeler.forEach((sube, i) => {
    let subeToplam = 0;
    Object.keys(grid).forEach(key => {
      if (key.endsWith("|" + sube)) subeToplam += grid[key];
    });
    genelToplam += subeToplam;
    const c = ws.getCell(r, 2 + i);
    c.value = subeToplam;
    hucreStilVer(c, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center" } });
  });
  const gc = ws.getCell(r, toplamCol);
  gc.value = genelToplam;
  hucreStilVer(gc, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center" } });

  ws.getColumn(1).width = BC.urunGen;
  for (let i = 2; i <= toplamCol; i++) ws.getColumn(i).width = BC.veriGen;
  ws.views = [{ state: "frozen", ySplit: headerRow }];
}

function flatVeriHazirla(kayitlar) {
  const subeler = subeSirala([...new Set(kayitlar.map(k => k.sube))]);
  const grid = {};
  const birimler = {};
  kayitlar.forEach(k => {
    const etiket = urunEtiketi(k);
    grid[etiket + "|" + k.sube] = (grid[etiket + "|" + k.sube] || 0) + Number(k.miktar || 0);
    birimler[etiket] = k.birim;
  });
  const kategoriler = bolumSirala(new Set(kayitlar.map(urunBolumu)));
  return { subeler, grid, birimler, kategoriler };
}

function duzUretimSayfasiOlustur(wb, sayfaAdi, kayitlar, tarihBaslik) {
  const ws = wb.addWorksheet((sayfaAdi + " - Üretim").substring(0, 31));
  const BC = sayfaBicimi(sayfaAdi + " - Üretim");
  const BP = BC.punto, BY = BC.yukseklik;
  sayfaYazdirmaAyarla(ws, BC.yon);
  const { grid, birimler, kategoriler } = flatVeriHazirla(kayitlar);

  const boyDeger = k => (k.boy === undefined || k.boy === null || k.boy === "" ? 0 : Number(k.boy));
  const boyGrid = {};
  kayitlar.forEach(k => {
    if (!BOYLU_SUBE_BOYLARI[urunBolumu(k)]) return;
    const key = k.urun + "|" + boyDeger(k);
    boyGrid[key] = (boyGrid[key] || 0) + Number(k.miktar || 0);
  });
  const bolumBoylari = {};
  kategoriler.forEach(bolum => {
    const harita = BOYLU_SUBE_BOYLARI[bolum];
    if (!harita) return;
    const kanonik = [].concat(...Object.keys(harita).map(s => harita[s]));
    const mevcut = kayitlar.filter(k => urunBolumu(k) === bolum).map(boyDeger);
    bolumBoylari[bolum] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
  });

  const ustBaslik = ws.getCell(1, 1);
  ustBaslik.value = `${sayfaAdi} — Üretim — ${tarihBaslik}`;
  ustBaslik.font = { bold: true, size: 16 };
  ws.getRow(1).height = 26;

  // Bazı bölümler sayfanın sağına, ayrı bir blok olarak yazılır (SAYFA_BICIMI.yanBlok).
  const yanBolumler = (BC.yanBlok || []).filter(b => kategoriler.includes(b));
  const anaBolumler = kategoriler.filter(b => yanBolumler.indexOf(b) === -1);
  const genelToplam = Object.values(grid).reduce((t, v) => t + v, 0);

  // Bir blok yazar; bas = ürün adı sütunu. Geriye son değer sütununu döner.
  function blokYaz(bas, bolumler, ustBaslikVar) {
    const genislik = Math.max(1, ...bolumler.map(b => (bolumBoylari[b] || [0]).length));
    const son = bas + genislik;
    if (ustBaslikVar) {
      ws.getRow(3).height = BY;
      const h = ws.getCell(3, bas);
      h.value = "ÜRÜN";
      hucreStilVer(h, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
      for (let c = bas + 1; c <= son; c++) {
        hucreStilVer(ws.getCell(3, c), { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
      }
      ws.getCell(3, bas + 1).value = "TOPLAM";
      if (son > bas + 1) ws.mergeCells(3, bas + 1, 3, son);
    }
    let r = 4;
    bolumler.forEach(bolum => {
      const kyt = kayitlar.filter(k => urunBolumu(k) === bolum);
      const boylar = bolumBoylari[bolum];

      ws.getRow(r).height = BY;
      const bc = ws.getCell(r, bas);
      bc.value = bolum;
      hucreStilVer(bc, { fill: RENK_KATEGORI, bold: true, boyut: BP });
      for (let c = bas + 1; c <= son; c++) hucreStilVer(ws.getCell(r, c), { fill: RENK_KATEGORI });
      if (boylar) {
        boylar.forEach((boy, i) => {
          const c = ws.getCell(r, bas + 1 + i);
          c.value = "NO " + boy;
          hucreStilVer(c, { fill: RENK_KATEGORI, bold: true, boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
        });
      } else if (!ustBaslikVar) {
        for (let c = bas + 1; c <= son; c++) {
          hucreStilVer(ws.getCell(r, c), { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
        }
        ws.getCell(r, bas + 1).value = "TOPLAM";
        if (son > bas + 1) ws.mergeCells(r, bas + 1, r, son);
      }
      r++;

      if (boylar) {
        const brm = {};
        kyt.forEach(k => { brm[k.urun] = k.birim; });
        urunSirala(new Set(kyt.map(k => k.urun))).forEach(urun => {
          ws.getRow(r).height = BY;
          const ad = ws.getCell(r, bas);
          ad.value = urun + (brm[urun] ? ` (${brm[urun]})` : "");
          hucreStilVer(ad, { boyut: BP, hizalama: { vertical: "middle" } });
          boylar.forEach((boy, i) => {
            const c = ws.getCell(r, bas + 1 + i);
            c.value = boyGrid[urun + "|" + boy] || null;
            hucreStilVer(c, { bold: true, boyut: BP, fill: RENK_TOPLAM_SUTUN, hizalama: { horizontal: "center", vertical: "middle" } });
          });
          for (let c = bas + 1 + boylar.length; c <= son; c++) hucreStilVer(ws.getCell(r, c), { boyut: BP });
          r++;
        });
      } else {
        urunSirala(new Set(kyt.map(urunEtiketi))).forEach(etiket => {
          ws.getRow(r).height = BY;
          const ad = ws.getCell(r, bas);
          ad.value = etiket + (birimler[etiket] ? ` (${birimler[etiket]})` : "");
          hucreStilVer(ad, { boyut: BP, hizalama: { vertical: "middle" } });
          let t = 0;
          Object.keys(grid).forEach(key => { if (key.startsWith(etiket + "|")) t += grid[key]; });
          const tc = ws.getCell(r, bas + 1);
          tc.value = t;
          hucreStilVer(tc, { bold: true, boyut: BP, fill: RENK_TOPLAM_SUTUN, hizalama: { horizontal: "center", vertical: "middle" } });
          for (let c = bas + 2; c <= son; c++) hucreStilVer(ws.getCell(r, c), { boyut: BP });
          r++;
        });
      }
    });

    ws.getRow(r).height = BY;
    const gc = ws.getCell(r, bas);
    gc.value = "GENEL TOPLAM";
    hucreStilVer(gc, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
    for (let c = bas + 1; c <= son; c++) {
      hucreStilVer(ws.getCell(r, c), { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
    }
    ws.getCell(r, bas + 1).value = genelToplam;
    return son;
  }

  const anaSon = blokYaz(1, anaBolumler, true);
  ws.getColumn(1).width = BC.urunGen;
  for (let i = 2; i <= anaSon; i++) ws.getColumn(i).width = BC.veriGen;

  if (yanBolumler.length) {
    const yanBas = anaSon + 3;   // araya iki boş sütun
    const yanSon = blokYaz(yanBas, yanBolumler, false);
    ws.getColumn(yanBas).width = BC.yanUrunGen || BC.urunGen;
    for (let i = yanBas + 1; i <= yanSon; i++) ws.getColumn(i).width = BC.veriGen;
  }

  ws.views = [{ state: "frozen", ySplit: 3 }];
}

function duzDagitimSayfasiOlustur(wb, sayfaAdi, kayitlar, tarihBaslik) {
  const ws = wb.addWorksheet((sayfaAdi + " - Dağıtım").substring(0, 31));
  const BC = sayfaBicimi(sayfaAdi + " - Dağıtım");
  const BP = BC.punto, BY = BC.yukseklik;
  sayfaYazdirmaAyarla(ws, BC.yon);
  const { subeler, grid, birimler, kategoriler } = flatVeriHazirla(kayitlar);
  const boyDeger = k => (k.boy === undefined || k.boy === null || k.boy === "" ? 0 : Number(k.boy));

  const ustBaslik = ws.getCell(1, 1);
  ustBaslik.value = `${sayfaAdi} — Dağıtım — ${tarihBaslik}`;
  ustBaslik.font = { bold: true, size: 16 };
  ws.getRow(1).height = 26;

  // Boylu bölümler (ör. Bütün Cheesecake) sayfanın altına, kendi şube+boy
  // başlıklı ayrı tablosuyla yazılır; kalan bölümler tek şube sütunlu ana tabloda.
  const boyluBolumler = kategoriler.filter(b => !!BOYLU_SUBE_BOYLARI[b]);
  const duzBolumler = kategoriler.filter(b => !BOYLU_SUBE_BOYLARI[b]);

  let r = 2;
  let enGenisCol = 1 + subeler.length;

  if (duzBolumler.length) {
    ws.getRow(r).height = BY;
    const h = ws.getCell(r, 1);
    h.value = "ÜRÜN";
    hucreStilVer(h, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
    subeler.forEach((s, i) => {
      const c = ws.getCell(r, 2 + i);
      c.value = s.toLocaleUpperCase("tr");
      hucreStilVer(c, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
    });
    r++;

    duzBolumler.forEach(bolum => {
      const kyt = kayitlar.filter(k => urunBolumu(k) === bolum);
      ws.getRow(r).height = BY;
      const bc = ws.getCell(r, 1);
      bc.value = bolum;
      hucreStilVer(bc, { fill: RENK_KATEGORI, bold: true, boyut: BP });
      for (let c = 2; c <= 1 + subeler.length; c++) hucreStilVer(ws.getCell(r, c), { fill: RENK_KATEGORI });
      r++;
      urunSirala(new Set(kyt.map(urunEtiketi))).forEach(etiket => {
        ws.getRow(r).height = BY;
        const ad = ws.getCell(r, 1);
        ad.value = etiket + (birimler[etiket] ? ` (${birimler[etiket]})` : "");
        hucreStilVer(ad, { boyut: BP, hizalama: { vertical: "middle" } });
        subeler.forEach((sube, i) => {
          const c = ws.getCell(r, 2 + i);
          c.value = grid[etiket + "|" + sube] || null;
          hucreStilVer(c, { boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
        });
        r++;
      });
    });

    ws.getRow(r).height = BY;
    const gc = ws.getCell(r, 1);
    gc.value = "GENEL TOPLAM";
    hucreStilVer(gc, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
    subeler.forEach((sube, i) => {
      let t = 0;
      duzBolumler.forEach(bolum => {
        kayitlar.filter(k => urunBolumu(k) === bolum && k.sube === sube)
          .forEach(k => { t += Number(k.miktar || 0); });
      });
      const c = ws.getCell(r, 2 + i);
      c.value = t;
      hucreStilVer(c, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
    });
    r++;
  }

  // Boylu bölümler için ayrı tablolar
  boyluBolumler.forEach(bolum => {
    const harita = BOYLU_SUBE_BOYLARI[bolum];
    const kyt = kayitlar.filter(k => urunBolumu(k) === bolum);
    const bolumSubeleri = subeSirala(subeler.filter(s => harita[s] || kyt.some(k => k.sube === s)));
    if (bolumSubeleri.length === 0) return;
    const subeBoylari = {};
    bolumSubeleri.forEach(s => {
      const kanonik = harita[s] || [0];
      const mevcut = kyt.filter(k => k.sube === s).map(boyDeger);
      subeBoylari[s] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
    });

    r++; // araya boş satır
    const r1 = r, r2 = r + 1;
    ws.getRow(r1).height = BY;
    ws.getRow(r2).height = BY;

    let col = 2;
    const subeBas = {};
    bolumSubeleri.forEach(sube => {
      const boylar = subeBoylari[sube];
      subeBas[sube] = col;
      const bas = col, bit = col + boylar.length - 1;
      if (bit > bas) ws.mergeCells(r1, bas, r1, bit);
      const c1 = ws.getCell(r1, bas);
      c1.value = sube.toLocaleUpperCase("tr");
      hucreStilVer(c1, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
      for (let i = bas + 1; i <= bit; i++) hucreStilVer(ws.getCell(r1, i), { fill: RENK_SUBE_BASLIK });
      boylar.forEach((boy, i) => {
        const c2 = ws.getCell(r2, bas + i);
        c2.value = "NO " + boy;
        hucreStilVer(c2, { fill: RENK_KATEGORI, bold: true, boyut: BP, hizalama: { horizontal: "center" } });
      });
      col = bit + 1;
    });
    const sonCol = col - 1;
    enGenisCol = Math.max(enGenisCol, sonCol);

    hucreStilVer(ws.getCell(r1, 1), { fill: RENK_KATEGORI });
    const bc = ws.getCell(r2, 1);
    bc.value = bolum;
    hucreStilVer(bc, { fill: RENK_KATEGORI, bold: true, boyut: BP, hizalama: { vertical: "middle" } });
    r = r2 + 1;

    const bg = {};
    const brm = {};
    kyt.forEach(k => {
      bg[k.urun + "|" + k.sube + "|" + boyDeger(k)] = (bg[k.urun + "|" + k.sube + "|" + boyDeger(k)] || 0) + Number(k.miktar || 0);
      brm[k.urun] = k.birim;
    });
    urunSirala(new Set(kyt.map(k => k.urun))).forEach(urun => {
      ws.getRow(r).height = BY;
      const ad = ws.getCell(r, 1);
      ad.value = urun + (brm[urun] ? ` (${brm[urun]})` : "");
      hucreStilVer(ad, { boyut: BP, hizalama: { vertical: "middle" } });
      bolumSubeleri.forEach(sube => {
        subeBoylari[sube].forEach((boy, i) => {
          const c = ws.getCell(r, subeBas[sube] + i);
          c.value = bg[urun + "|" + sube + "|" + boy] || null;
          hucreStilVer(c, { boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
        });
      });
      r++;
    });
  });

  ws.getColumn(1).width = BC.urunGen;
  for (let i = 2; i <= enGenisCol; i++) ws.getColumn(i).width = BC.veriGen;
  ws.views = [{ state: "frozen", ySplit: 2 }];
}

function boyluUretimSayfasiOlustur(wb, sayfaAdi, kayitlar, tarihBaslik) {
  const ws = wb.addWorksheet((sayfaAdi + " - Üretim").substring(0, 31));
  const BC = sayfaBicimi(sayfaAdi + " - Üretim");
  const BP = BC.punto, BY = BC.yukseklik;
  sayfaYazdirmaAyarla(ws, BC.yon);
  const subeler = subeSirala([...new Set(kayitlar.map(k => k.sube))]);
  const subeBoylariKanonik = BOYLU_SUBE_BOYLARI[sayfaAdi] || {};
  const urunSirasi = BOYLU_URUN_SIRALARI[sayfaAdi] || [];

  const ustBaslik = ws.getCell(1, 1);
  ustBaslik.value = `${sayfaAdi} — Üretim — ${tarihBaslik}`;
  ustBaslik.font = { bold: true, size: 16 };
  ws.getRow(1).height = 26;

  const boyDeger = k => (k.boy === undefined || k.boy === null || k.boy === "" ? 0 : Number(k.boy));
  const subeBoylari = {};
  subeler.forEach(sube => {
    const kanonik = subeBoylariKanonik[sube] || [0];
    const mevcut = kayitlar.filter(k => k.sube === sube).map(boyDeger);
    subeBoylari[sube] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
  });
  const tumBoylar = [...new Set(subeler.flatMap(s => subeBoylari[s]))].sort((a, b) => a - b);

  const grid = {};
  kayitlar.forEach(k => {
    const key = k.urun + "|" + k.sube + "|" + boyDeger(k);
    grid[key] = (grid[key] || 0) + Number(k.miktar || 0);
  });

  const urunlerVar = urunSirasi.filter(urun => kayitlar.some(k => k.urun === urun));
  kayitlar.forEach(k => {
    if (!urunlerVar.includes(k.urun)) urunlerVar.push(k.urun);
  });

  const headerRow = 3;
  ws.getRow(headerRow).height = BY;
  hucreStilVer(ws.getCell(headerRow, 1), { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
  ws.getCell(headerRow, 1).value = "ÜRÜN";
  tumBoylar.forEach((boy, i) => {
    const c = ws.getCell(headerRow, 2 + i);
    c.value = "NO " + boy;
    hucreStilVer(c, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
  });
  const toplamCol = 1 + tumBoylar.length;

  let r = headerRow + 1;
  urunlerVar.forEach(urun => {
    ws.getRow(r).height = BY;
    const ad = ws.getCell(r, 1);
    ad.value = urun;
    hucreStilVer(ad, { boyut: BP, hizalama: { vertical: "middle" } });
    tumBoylar.forEach((boy, i) => {
      let toplam = 0;
      subeler.forEach(sube => { toplam += grid[urun + "|" + sube + "|" + boy] || 0; });
      const c = ws.getCell(r, 2 + i);
      c.value = toplam || null;
      hucreStilVer(c, { bold: true, boyut: BP, fill: RENK_TOPLAM_SUTUN, hizalama: { horizontal: "center", vertical: "middle" } });
    });
    r++;
  });

  ws.getRow(r).height = BY;
  hucreStilVer(ws.getCell(r, 1), { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
  ws.getCell(r, 1).value = "GENEL TOPLAM";
  tumBoylar.forEach((boy, i) => {
    let toplam = 0;
    subeler.forEach(sube => {
      urunlerVar.forEach(urun => { if (!ISTEK_URUNLERI.has(urun)) toplam += grid[urun + "|" + sube + "|" + boy] || 0; });
    });
    const c = ws.getCell(r, 2 + i);
    c.value = toplam;
    hucreStilVer(c, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
  });

  ws.getColumn(1).width = BC.urunGen;
  for (let i = 2; i <= toplamCol; i++) ws.getColumn(i).width = BC.veriGen;
  ws.views = [{ state: "frozen", ySplit: headerRow }];
}

function boyluDagitimSayfasiOlustur(wb, sayfaAdi, kayitlar, tarihBaslik) {
  const ws = wb.addWorksheet((sayfaAdi + " - Dağıtım").substring(0, 31));
  const BC = sayfaBicimi(sayfaAdi + " - Dağıtım");
  const BP = BC.punto, BY = BC.yukseklik;
  sayfaYazdirmaAyarla(ws, BC.yon);
  const subeler = subeSirala([...new Set(kayitlar.map(k => k.sube))]);
  const subeBoylariKanonik = BOYLU_SUBE_BOYLARI[sayfaAdi] || {};
  const urunSirasi = BOYLU_URUN_SIRALARI[sayfaAdi] || [];

  const ustBaslik = ws.getCell(1, 1);
  ustBaslik.value = `${sayfaAdi} — Dağıtım — ${tarihBaslik}`;
  ustBaslik.font = { bold: true, size: 16 };
  ws.getRow(1).height = 26;

  const boyDeger = k => (k.boy === undefined || k.boy === null || k.boy === "" ? 0 : Number(k.boy));

  const subeBoylari = {};
  subeler.forEach(sube => {
    const kanonik = subeBoylariKanonik[sube] || [0];
    const mevcut = kayitlar.filter(k => k.sube === sube).map(boyDeger);
    subeBoylari[sube] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
  });

  const r1 = 2, r2 = 3;
  ws.getRow(r1).height = BY;
  ws.getRow(r2).height = BY;

  const urunBaslik = ws.getCell(r1, 1);
  urunBaslik.value = "ÜRÜN";
  ws.mergeCells(r1, 1, r2, 1);
  hucreStilVer(urunBaslik, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
  hucreStilVer(ws.getCell(r2, 1), { fill: RENK_SUBE_BASLIK });

  // Şube grupları arasına ince boş ayraç sütunu konur (görsel ayrım).
  const ayiracGen = BC.ayirac || 0;
  const ayiracSutunlari = [];
  let col = 2;
  const subeBaslangic = {};
  subeler.forEach((sube, si) => {
    if (si > 0 && ayiracGen) { ayiracSutunlari.push(col); col++; }
    const boylar = subeBoylari[sube];
    subeBaslangic[sube] = col;
    const bas = col, bit = col + boylar.length - 1;
    if (bit > bas) ws.mergeCells(r1, bas, r1, bit);
    const c1 = ws.getCell(r1, bas);
    c1.value = sube.toLocaleUpperCase("tr");
    hucreStilVer(c1, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
    for (let i = bas + 1; i <= bit; i++) hucreStilVer(ws.getCell(r1, i), { fill: RENK_SUBE_BASLIK });
    boylar.forEach((boy, i) => {
      const c2 = ws.getCell(r2, bas + i);
      c2.value = "Boy " + boy;
      hucreStilVer(c2, { fill: RENK_SUBE_BASLIK, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center" } });
    });
    col = bit + 1;
  });
  const toplamCol = col - 1;

  const grid = {};
  kayitlar.forEach(k => {
    const key = k.urun + "|" + k.sube + "|" + boyDeger(k);
    grid[key] = (grid[key] || 0) + Number(k.miktar || 0);
  });

  const urunlerVar = urunSirasi.filter(urun => kayitlar.some(k => k.urun === urun));
  kayitlar.forEach(k => {
    if (!urunlerVar.includes(k.urun)) urunlerVar.push(k.urun);
  });

  let r = r2 + 1;
  urunlerVar.forEach(urun => {
    ws.getRow(r).height = BY;
    const ad = ws.getCell(r, 1);
    ad.value = urun;
    hucreStilVer(ad, { boyut: BP, hizalama: { vertical: "middle" } });
    subeler.forEach(sube => {
      subeBoylari[sube].forEach((boy, i) => {
        const c = ws.getCell(r, subeBaslangic[sube] + i);
        c.value = grid[urun + "|" + sube + "|" + boy] || null;
        hucreStilVer(c, { boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
      });
    });
    r++;
  });

  ws.getRow(r).height = BY;
  const genelAd = ws.getCell(r, 1);
  genelAd.value = "GENEL TOPLAM";
  hucreStilVer(genelAd, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { vertical: "middle" } });
  subeler.forEach(sube => {
    subeBoylari[sube].forEach((boy, i) => {
      let toplam = 0;
      urunlerVar.forEach(urun => { if (!ISTEK_URUNLERI.has(urun)) toplam += grid[urun + "|" + sube + "|" + boy] || 0; });
      const c = ws.getCell(r, subeBaslangic[sube] + i);
      c.value = toplam;
      hucreStilVer(c, { fill: RENK_TOPLAM_SATIR, bold: true, renk: "FFFFFFFF", boyut: BP, hizalama: { horizontal: "center", vertical: "middle" } });
    });
  });

  ws.getColumn(1).width = BC.urunGen;
  for (let i = 2; i <= toplamCol; i++) ws.getColumn(i).width = BC.veriGen;
  // Şube ayraç sütunları: ince ve koyu dolgulu — tablo boyunca dikey çizgi gibi durur.
  ayiracSutunlari.forEach(i => {
    ws.getColumn(i).width = ayiracGen;
    for (let sr = r1; sr <= r; sr++) {
      hucreStilVer(ws.getCell(sr, i), { fill: RENK_TOPLAM_SATIR, kenarlik: false });
    }
  });
  ws.views = [{ state: "frozen", xSplit: 1, ySplit: r2 }];
}

// ---- Panelden doğrudan yazdırma -------------------------------------
// Excel raporundaki sayfaların aynısını HTML olarak kurar; her sayfa
// ayrı bir A4 yaprağına basılır. Excel fonksiyonlarıyla aynı veri
// hazırlama mantığını kullanır, sadece çıktı biçimi farklıdır.

function htmlKac(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Sütun sayısına göre yazdırma puntosu — az sütunda büyük, çok sütunda sığacak kadar.
function puntoSinifi(sutunSayisi) {
  if (sutunSayisi <= 3) return "p-xl";
  if (sutunSayisi <= 6) return "p-l";
  if (sutunSayisi <= 10) return "p-m";
  if (sutunSayisi <= 16) return "p-s";
  return "p-xs";
}

function yazdirSayfasi(baslik, sutunSayisi, tabloHtml) {
  const bolum = document.createElement("section");
  bolum.className = "yazdir-sayfa " + puntoSinifi(sutunSayisi);
  bolum.innerHTML = `<h2>${htmlKac(baslik)}</h2><table>${tabloHtml}</table>`;
  return bolum;
}

function yazdirDuzUretim(sayfaAdi, kayitlar, tarihBaslik) {
  const { grid, birimler, kategoriler } = flatVeriHazirla(kayitlar);
  const boyDeger = k => (k.boy === undefined || k.boy === null || k.boy === "" ? 0 : Number(k.boy));
  const boyGrid = {};
  kayitlar.forEach(k => {
    if (!BOYLU_SUBE_BOYLARI[k.kategori]) return;
    const key = k.urun + "|" + boyDeger(k);
    boyGrid[key] = (boyGrid[key] || 0) + Number(k.miktar || 0);
  });
  const kategoriBoylari = {};
  kategoriler.forEach(kategori => {
    const harita = BOYLU_SUBE_BOYLARI[kategori];
    if (!harita) return;
    const kanonik = [].concat(...Object.keys(harita).map(s => harita[s]));
    const mevcut = kayitlar.filter(k => urunBolumu(k) === kategori).map(boyDeger);
    kategoriBoylari[kategori] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
  });
  const enFazlaBoy = Object.keys(kategoriBoylari).reduce((m, k) => Math.max(m, kategoriBoylari[k].length), 1);
  const sutunSayisi = 1 + enFazlaBoy;

  let html = '<thead><tr><th style="width:46%">ÜRÜN</th><th class="toplam-bas">TOPLAM</th>';
  for (let c = 3; c <= sutunSayisi; c++) html += '<th class="toplam-bas">&nbsp;</th>';
  html += "</tr></thead><tbody>";

  kategoriler.forEach(kategori => {
    const kategoriKayitlari = kayitlar.filter(k => urunBolumu(k) === kategori);
    const boylar = kategoriBoylari[kategori];
    const boylu = !!boylar;

    if (boylu) {
      html += `<tr class="kategori"><td>${htmlKac(kategori)}</td>`;
      boylar.forEach(boy => (html += `<td>no ${boy}</td>`));
      for (let c = 2 + boylar.length; c <= sutunSayisi; c++) html += "<td></td>";
      html += "</tr>";
    } else {
      html += `<tr class="kategori"><td colspan="${sutunSayisi}">${htmlKac(kategori)}</td></tr>`;
    }

    if (boylu) {
      const urunBirimleri = {};
      kategoriKayitlari.forEach(k => { urunBirimleri[k.urun] = k.birim; });
      urunSirala(new Set(kategoriKayitlari.map(k => k.urun))).forEach(urun => {
        html += `<tr><td class="urun">${htmlKac(urun)}${urunBirimleri[urun] ? " (" + htmlKac(urunBirimleri[urun]) + ")" : ""}</td>`;
        boylar.forEach(boy => {
          const v = boyGrid[urun + "|" + boy] || 0;
          html += `<td class="toplam-h">${v || ""}</td>`;
        });
        for (let c = 2 + boylar.length; c <= sutunSayisi; c++) html += "<td></td>";
        html += "</tr>";
      });
    } else {
      urunSirala(new Set(kategoriKayitlari.map(urunEtiketi))).forEach(etiket => {
        let toplam = 0;
        Object.keys(grid).forEach(key => { if (key.startsWith(etiket + "|")) toplam += grid[key]; });
        html += `<tr><td class="urun">${htmlKac(etiket)}${birimler[etiket] ? " (" + htmlKac(birimler[etiket]) + ")" : ""}</td>`;
        html += `<td class="toplam-h">${toplam}</td>`;
        for (let c = 3; c <= sutunSayisi; c++) html += "<td></td>";
        html += "</tr>";
      });
    }
  });

  let genelToplam = 0;
  Object.values(grid).forEach(v => { genelToplam += v; });
  html += `<tr class="genel"><td class="urun">GENEL TOPLAM</td><td>${genelToplam}</td>`;
  for (let c = 3; c <= sutunSayisi; c++) html += "<td></td>";
  html += "</tr></tbody>";

  return yazdirSayfasi(`${sayfaAdi} — Üretim — ${tarihBaslik}`, sutunSayisi, html);
}

function yazdirDuzDagitim(sayfaAdi, kayitlar, tarihBaslik) {
  const { subeler, grid, birimler, kategoriler } = flatVeriHazirla(kayitlar);
  const boyluVarMi = kategoriler.some(k => BOYLU_SUBE_BOYLARI[k]);

  if (!boyluVarMi) {
    const sutunSayisi = 1 + subeler.length;
    let html = '<thead><tr><th style="width:40%">ÜRÜN</th>';
    subeler.forEach(s => (html += `<th>${htmlKac(s.toLocaleUpperCase("tr"))}</th>`));
    html += "</tr></thead><tbody>";

    kategoriler.forEach(kategori => {
      const kategoriKayitlari = kayitlar.filter(k => urunBolumu(k) === kategori);
      html += `<tr class="kategori"><td colspan="${sutunSayisi}">${htmlKac(kategori)}</td></tr>`;
      urunSirala(new Set(kategoriKayitlari.map(urunEtiketi))).forEach(etiket => {
        html += `<tr><td class="urun">${htmlKac(etiket)}${birimler[etiket] ? " (" + htmlKac(birimler[etiket]) + ")" : ""}</td>`;
        subeler.forEach(sube => {
          const m = grid[etiket + "|" + sube] || 0;
          html += `<td>${m || ""}</td>`;
        });
        html += "</tr>";
      });
    });

    html += '<tr class="genel"><td class="urun">GENEL TOPLAM</td>';
    subeler.forEach(sube => {
      let t = 0;
      Object.keys(grid).forEach(key => { if (key.endsWith("|" + sube)) t += grid[key]; });
      html += `<td>${t}</td>`;
    });
    html += "</tr></tbody>";
    return yazdirSayfasi(`${sayfaAdi} — Dağıtım — ${tarihBaslik}`, sutunSayisi, html);
  }

  const boyDeger = k => (k.boy === undefined || k.boy === null || k.boy === "" ? 0 : Number(k.boy));
  const rowKey = k => (BOYLU_SUBE_BOYLARI[k.kategori] ? k.urun : urunEtiketi(k));

  const subeBoylari = {};
  subeler.forEach(sube => {
    const kanonikListeleri = kategoriler.filter(k => BOYLU_SUBE_BOYLARI[k]).map(k => BOYLU_SUBE_BOYLARI[k][sube] || [0]);
    const kanonik = kanonikListeleri.length ? [].concat(...kanonikListeleri) : [0];
    const mevcut = kayitlar.filter(k => k.sube === sube).map(boyDeger);
    subeBoylari[sube] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
  });

  const boyluGrid = {};
  const boyluBirimler = {};
  kayitlar.forEach(k => {
    const key = rowKey(k) + "|" + k.sube + "|" + boyDeger(k);
    boyluGrid[key] = (boyluGrid[key] || 0) + Number(k.miktar || 0);
    boyluBirimler[rowKey(k)] = k.birim;
  });

  const sutunSayisi = 1 + subeler.reduce((t, s) => t + subeBoylari[s].length, 0);

  let html = '<thead><tr><th rowspan="2" style="width:26%">ÜRÜN</th>';
  subeler.forEach(sube => (html += `<th colspan="${subeBoylari[sube].length}">${htmlKac(sube.toLocaleUpperCase("tr"))}</th>`));
  html += "</tr><tr>";
  subeler.forEach(sube => {
    const boylar = subeBoylari[sube];
    boylar.forEach(boy => (html += `<th>${boylar.length > 1 ? "Boy " + boy : "&nbsp;"}</th>`));
  });
  html += "</tr></thead><tbody>";

  kategoriler.forEach(kategori => {
    const kategoriKayitlari = kayitlar.filter(k => urunBolumu(k) === kategori);
    const boylu = !!BOYLU_SUBE_BOYLARI[kategori];
    const etiketler = boylu
      ? urunSirala(new Set(kategoriKayitlari.map(k => k.urun)))
      : urunSirala(new Set(kategoriKayitlari.map(urunEtiketi)));

    html += `<tr class="kategori"><td colspan="${sutunSayisi}">${htmlKac(kategori)}</td></tr>`;
    etiketler.forEach(etiket => {
      html += `<tr><td class="urun">${htmlKac(etiket)}${boyluBirimler[etiket] ? " (" + htmlKac(boyluBirimler[etiket]) + ")" : ""}</td>`;
      subeler.forEach(sube => {
        subeBoylari[sube].forEach(boy => {
          const v = boyluGrid[etiket + "|" + sube + "|" + boy] || 0;
          html += `<td>${v || ""}</td>`;
        });
      });
      html += "</tr>";
    });
  });

  html += '<tr class="genel"><td class="urun">GENEL TOPLAM</td>';
  subeler.forEach(sube => {
    subeBoylari[sube].forEach(boy => {
      let t = 0;
      Object.keys(boyluGrid).forEach(key => { if (key.endsWith("|" + sube + "|" + boy)) t += boyluGrid[key]; });
      html += `<td>${t}</td>`;
    });
  });
  html += "</tr></tbody>";

  return yazdirSayfasi(`${sayfaAdi} — Dağıtım — ${tarihBaslik}`, sutunSayisi, html);
}

function yazdirBoyluUretim(sayfaAdi, kayitlar, tarihBaslik) {
  const subeler = subeSirala([...new Set(kayitlar.map(k => k.sube))]);
  const subeBoylariKanonik = BOYLU_SUBE_BOYLARI[sayfaAdi] || {};
  const urunSirasi = BOYLU_URUN_SIRALARI[sayfaAdi] || [];
  const boyDeger = k => (k.boy === undefined || k.boy === null || k.boy === "" ? 0 : Number(k.boy));

  const subeBoylari = {};
  subeler.forEach(sube => {
    const kanonik = subeBoylariKanonik[sube] || [0];
    const mevcut = kayitlar.filter(k => k.sube === sube).map(boyDeger);
    subeBoylari[sube] = [...new Set([...kanonik, ...mevcut])].sort((a, b) => a - b);
  });
  const tumBoylar = [...new Set(subeler.flatMap(s => subeBoylari[s]))].sort((a, b) => a - b);

  const grid = {};
  kayitlar.forEach(k => {
    const key = k.urun + "|" + k.sube + "|" + boyDeger(k);
    grid[key] = (grid[key] || 0) + Number(k.miktar || 0);
  });

  const urunlerVar = urunSirasi.filter(urun => kayitlar.some(k => k.urun === urun));
  kayitlar.forEach(k => { if (!urunlerVar.includes(k.urun)) urunlerVar.push(k.urun); });

  const sutunSayisi = 1 + tumBoylar.length;
  let html = '<thead><tr><th style="width:46%">ÜRÜN</th>';
  tumBoylar.forEach(boy => (html += `<th class="toplam-bas">no ${boy}</th>`));
  html += "</tr></thead><tbody>";

  urunlerVar.forEach(urun => {
    html += `<tr><td class="urun">${htmlKac(urun)}</td>`;
    tumBoylar.forEach(boy => {
      let t = 0;
      subeler.forEach(sube => { t += grid[urun + "|" + sube + "|" + boy] || 0; });
      html += `<td class="toplam-h">${t || ""}</td>`;
    });
    html += "</tr>";
  });

  html += '<tr class="genel"><td class="urun">GENEL TOPLAM</td>';
  tumBoylar.forEach(boy => {
    let t = 0;
    subeler.forEach(sube => { urunlerVar.forEach(urun => { if (!ISTEK_URUNLERI.has(urun)) t += grid[urun + "|" + sube + "|" + boy] || 0; }); });
    html += `<td>${t}</td>`;
  });
  html += "</tr></tbody>";

  return yazdirSayfasi(`${sayfaAdi} — Üretim — ${tarihBaslik}`, sutunSayisi, html);
}

  html += '<tr class="genel"><td class="urun">GENEL TOPLAM</td>';
  subeler.forEach(sube => {
    subeBoylari[sube].forEach(boy => {

    });

  html += "</tr></tbody>";

// Tatlı/Tuzlu Kurabiye: tek sayfa, şube sütunları + TOPLAM birlikte.
function yazdirBirlesikSayfa(sayfaAdi, kayitlar, tarihBaslik) {
  const { subeler, grid, birimler, kategoriler } = flatVeriHazirla(kayitlar);
  const sutunSayisi = 2 + subeler.length;

  let html = '<thead><tr><th style="width:30%">ÜRÜN</th>';
  subeler.forEach(s => (html += `<th>${htmlKac(s.toLocaleUpperCase("tr"))}</th>`));
  html += '<th class="toplam-bas">TOPLAM</th></tr></thead><tbody>';

  kategoriler.forEach(kategori => {
    const kategoriKayitlari = kayitlar.filter(k => urunBolumu(k) === kategori);
    html += `<tr class="kategori"><td colspan="${sutunSayisi}">${htmlKac(kategori)}</td></tr>`;
    urunSirala(new Set(kategoriKayitlari.map(urunEtiketi))).forEach(etiket => {
      html += `<tr><td class="urun">${htmlKac(etiket)}${birimler[etiket] ? " (" + htmlKac(birimler[etiket]) + ")" : ""}</td>`;
      let satirToplam = 0;
      subeler.forEach(sube => {
        const m = grid[etiket + "|" + sube] || 0;
        satirToplam += m;
        html += `<td>${m || ""}</td>`;
      });
      html += `<td class="toplam-h">${satirToplam}</td></tr>`;
    });
  });

  let genelToplam = 0;
  html += '<tr class="genel"><td class="urun">GENEL TOPLAM</td>';
  subeler.forEach(sube => {
    let t = 0;
    Object.keys(grid).forEach(key => { if (key.endsWith("|" + sube)) t += grid[key]; });
    genelToplam += t;
    html += `<td>${t}</td>`;
  });
  html += `<td>${genelToplam}</td></tr></tbody>`;

  return yazdirSayfasi(`${sayfaAdi} — ${tarihBaslik}`, sutunSayisi, html);
}

function raporuYazdir() {
  const bas = baslangicInput.value;
  const bit = bitisInput.value || bas;
  if (!bas) {
    goster("hata", "Önce bir tarih seçin.");
    return;
  }
  const kayitlar = TUM_KAYITLAR.filter(k => k.tarih >= bas && k.tarih <= bit && k.urun !== "NOT");
  if (kayitlar.length === 0) {
    goster("hata", "Bu tarih aralığı için yazdırılacak talep yok.");
    return;
  }

  const tarihBaslik = bas === bit ? bas : `${bas} — ${bit}`;
  yazdirAlaniEl.innerHTML = "";

  RAPOR_SAYFA_SIRASI.forEach(sayfaAdi => {
    const sayfaKayitlari = kayitlar.filter(k => URUN_SAYFA[k.urun] === sayfaAdi);
    if (sayfaKayitlari.length === 0) return;
    if (BOYLU_URUN_SIRALARI[sayfaAdi]) {
      yazdirAlaniEl.appendChild(yazdirBoyluUretim(sayfaAdi, sayfaKayitlari, tarihBaslik));
      yazdirAlaniEl.appendChild(yazdirBoyluDagitim(sayfaAdi, sayfaKayitlari, tarihBaslik));
    } else if (SPLIT_KATEGORILER.includes(sayfaAdi)) {
      yazdirAlaniEl.appendChild(yazdirDuzUretim(sayfaAdi, sayfaKayitlari, tarihBaslik));
      yazdirAlaniEl.appendChild(yazdirDuzDagitim(sayfaAdi, sayfaKayitlari, tarihBaslik));
    } else {
      yazdirAlaniEl.appendChild(yazdirBirlesikSayfa(sayfaAdi, sayfaKayitlari, tarihBaslik));
    }
  });

  window.print();
}

// Kayıtların tutulduğu Google E-Tablo. Buraya adres yazılırsa doğrudan
// kullanılır; boşsa ilk tıklamada bir kez sorulup tarayıcıda saklanır.
const ETABLO_URL = "";

function etabloyuAc(olay) {
  let url = ETABLO_URL;
  if (!url) {
    try { url = localStorage.getItem("etabloUrl") || ""; } catch (e) { url = ""; }
  }
  // Shift ile tıklanırsa kayıtlı adresi değiştirmek için tekrar sorar.
  if (!url || (olay && olay.shiftKey)) {
    const girilen = (prompt(
      "Google E-Tablo bağlantısını yapıştırın:\n(tarayıcıda e-tabloyu açıp adres çubuğundan kopyalayın)",
      url || "https://docs.google.com/spreadsheets/d/"
    ) || "").trim();
    if (!girilen) return;
    if (!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(girilen)) {
      goster("hata", "Bu bir Google E-Tablo bağlantısı değil.");
      return;
    }
    url = girilen;
    try { localStorage.setItem("etabloUrl", url); } catch (e) {}
  }
  window.open(url, "_blank", "noopener");
}

async function zayiRaporuIndir() {
  const bas = baslangicInput.value;
  const bit = bitisInput.value || bas;
  if (!bas) { goster("hata", "Önce bir tarih seçin."); return; }
  const kayitlar = ZAYI_KAYITLARI.filter(k => k.tarih >= bas && k.tarih <= bit);
  if (kayitlar.length === 0) {
    goster("hata", "Bu tarih aralığında zayi bildirimi yok.");
    return;
  }

  indirZayiBtn.disabled = true;
  indirZayiBtn.textContent = "Hazırlanıyor...";
  try {
    const wb = new ExcelJS.Workbook();
    const tarihBaslik = bas === bit ? bas : `${bas} — ${bit}`;
    raporSayfasiOlustur(wb, "Zayi", kayitlar, tarihBaslik);

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `zayi-raporu_${bas}${bit !== bas ? "_" + bit : ""}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    goster("hata", "Zayi raporu oluşturulamadı: " + err.message);
  } finally {
    indirZayiBtn.disabled = false;
    indirZayiBtn.textContent = "Zayi Raporu (.xlsx)";
  }
}

function goster(tur, mesaj) {
  durumEl.className = "durum " + tur;
  durumEl.textContent = mesaj;
}
function gizle() {
  durumEl.className = "durum";
  durumEl.textContent = "";
}
