      <div class="onizleme" id="z-onizleme"></div>

    <form class="p-govde" novalidate>
      <div class="alan"><label for="d-ad">Ad</label><input id="d-ad" autocomplete="off" value="${e(d.ad || "")}" placeholder="ör. Atölye, Nişantaşı şubesi"></div>

        <div class="ipucu">Google Haritalar bu adresle mesafe hesaplar. Haritada aratıp bulduğunuz adresi yapıştırmak en güvenlisi.${d.adres ? ` <a href="https://www.google.com/maps/search/${encodeURIComponent(d.adres)}" target="_blank" rel="noopener">Haritada göster</a>` : ""}</div></div>

  $("d-kaydet").onclick = async () => {
    const durak = { id:d.id || null, ad:$("d-ad").value.trim(), adres:$("d-adres").value.trim().replace(/\s+/g, " "), aktif:$("d-aktif").checked };

/* ---------------- Olaylar ---------------- */
document.addEventListener("click", ev => {
  const s = ev.target.closest("[data-sekme]");
  if(s){ sekme = s.dataset.sekme; depoYaz(DEPO_SEKME, sekme); ciz(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest("[data-islem]");
  if(!b) return;
  const id = b.dataset.arac;
  switch(b.dataset.islem){
    case "kapat": pencereKapat(); break;
    case "cikis": cikisYap(); break;
    case "pin": pinFormu(); break;
    case "arac-yeni": aracFormu(null); break;
    case "arac-duzenle": if(A[id]) aracFormu(A[id]); break;
    case "km-gir": kayitFormu(null, { aracId:id, tur:"km" }); break;
    case "sofor-kayit": kayitFormu(null, { aracId:id, tur:b.dataset.tur }); break;
    case "sofor-arac": soforArac = id; depoYaz(DEPO_ARAC, id); ciz(); break;
    case "kayit-yeni": kayitFormu(null, { aracId:id || suz.arac || undefined, tur:(sekme === "kayitlar" && suz.tur) ? suz.tur : "yakit" }); break;
    case "kayit-duzenle": if(K[b.dataset.id]) kayitFormu(K[b.dataset.id]); break;
    case "ariza-kapat": {
      const btn = b; btn.disabled = true; btn.textContent = "…";
      api("arizaKapat", { id:b.dataset.id }).then(c => { if(c.ok){ bildir("✓ Arıza kapatıldı"); veriYukle(true); } else { btn.disabled = false; btn.textContent = "Çözüldü"; bildir(c.hata, true); } });
      break;
    }
    case "arac-kayitlari": suz = { arac:id, tur:"", ara:"", limit:100 }; sekme = "kayitlar"; ciz(); window.scrollTo(0, 0); break;
    case "daha": suz.limit += 100; ciz(); break;
    case "ay-sec": giderAy = b.dataset.ay; ciz(); break;
    case "csv": csvIndir(); break;
    case "kisi-yeni": kisiFormu(null); break;
    case "rota-gun": rotaTarih = b.dataset.tarih; sekme = "guzergah"; depoYaz(DEPO_SEKME, sekme); ciz(); window.scrollTo(0, 0); break;
    case "rota-kaydir": rotaTarih = gunKaydir(rotaTarih, +b.dataset.n); ciz(); break;
    case "rota-bugun": rotaTarih = bugun(); ciz(); break;
    case "duraklara-in": { const h = $("duraklar"); if(h) h.scrollIntoView({ behavior:"smooth", block:"start" }); break; }
    case "plan-yeni": planFormu(null, { aracId:id, tarih:rotaTarih }); break;
    case "plan-duzenle": if(P[b.dataset.id]) planFormu(P[b.dataset.id]); break;
    case "plan-kopyala": planKopyala(b); break;
    case "teslim-et": {
      const btn = b, geri = b.dataset.geri === "1"; btn.disabled = true;
      api("teslimEt", { id:b.dataset.id, geriAl:geri }).then(c => {
        if(c.ok){ if(D[btn.dataset.id]) D[btn.dataset.id].teslim = geri ? null : "x " + new Date().toTimeString().slice(0, 5); ciz(); bildir(geri ? "Teslim işareti kaldırıldı" : "✓ Teslim edildi"); veriYukle(true); }
        else { btn.disabled = false; bildir(c.hata, true); }
      });
      break;
    }
    case "durak-yeni": durakFormu(null); break;
    case "durak-duzenle": if(D[b.dataset.id]) durakFormu(D[b.dataset.id]); break;
    case "guz-yeni": guzergahFormu(null); break;
    case "guz-duzenle": if(G[b.dataset.id]) guzergahFormu(G[b.dataset.id]); break;
    case "kisi-duzenle": { const k = (kisilerCiz.liste || [])[+b.dataset.i]; if(k) kisiFormu(k); break; }
  }
});
$("fab").onclick = () => kayitFormu(null, { tur:"km", aracId:suz.arac || undefined });

/* ---------------- Başlangıç ---------------- */
(async () => {
  const s = depoOku(DEPO_SEKME, null); if(SEKMELER.includes(s)) sekme = s;
  if(SEKMELER.includes(location.hash.slice(1))) sekme = location.hash.slice(1);
  const kayitli = depoOku(DEPO_OTURUM, null);
  if(kayitli && kayitli.ad && kayitli.pin){
    oturum = kayitli;
    $("icerik").innerHTML = '<div class="bos"><h2>Araçlar yükleniyor…</h2></div>';
    const c = await api("giris");
    if(c.ok){ ben = c.kisi; ciz(); await veriYukle(); return; }
    if(!c.yenidenGiris && !/hatalı/i.test(c.hata || "")){
      $("icerik").innerHTML = `<div class="bos"><h2>Bağlanılamadı</h2><p>${e(c.hata)}</p><button class="btn" onclick="location.reload()">Tekrar dene</button></div>`;
      return;
    }
    oturum = null;
    return girisEkrani(c.hata);
  }
  girisEkrani("");
})();
</script>
