<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kasa+">
<title>Kasa+ · Finansal Yönetim</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --ink:#12181F;
  --ink-2:#1B232D;
  --paper:#F3F5F7;
  --card:#FFFFFF;
  --line:#E4E7EB;
  --text:#171B21;
  --text-2:#5B6472;
  --text-3:#8992A0;
  --brass:#AC7E32;
  --brass-soft:#F1E6D2;
  --income:#1C7A5E;
  --income-soft:#E3F1EC;
  --expense:#B03B32;
  --expense-soft:#FBE9E7;
  --shadow: 0 1px 2px rgba(18,24,31,.04), 0 8px 24px rgba(18,24,31,.06);
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper);
  color:var(--text);
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
.tabular{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}

/* Desktop sidebar */
#sidebar{
  width:230px; flex-shrink:0; background:var(--ink); color:#C7CDD6;
  display:flex; flex-direction:column;
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-name{color:#fff; font-size:18px; font-weight:700; letter-spacing:-.01em;}
.brand-name em{color:var(--brass); font-style:normal;}
.brand-sub{font-size:11px; color:#8891A0; margin-top:2px;}
#nav{flex:1; padding:10px 0;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 20px; font-size:13.5px;
  cursor:pointer; border-left:2px solid transparent; color:#AEB6C2;
}
.nav-item svg{width:17px; height:17px; opacity:.8; flex-shrink:0;}
.nav-item.active{background:rgba(255,255,255,.05); color:#fff; border-left-color:var(--brass);}
.nav-item:hover{color:#fff;}
.sidebar-foot{padding:14px 20px; font-size:10.5px; color:#6B7482; border-top:1px solid rgba(255,255,255,.08);}

/* Main column */
#main{flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh;}
#topbar{
  position:sticky; top:0; z-index:20; background:rgba(243,245,247,.9); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding:14px 22px; padding-top:calc(14px + var(--safe-top));
}
#topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
#page-title{font-size:19px; font-weight:700; letter-spacing:-.01em;}
#chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0;}
.chip{
  flex-shrink:0; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600;
  border:1px solid var(--line); background:var(--card); color:var(--text-2); cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}

#content{padding:18px 22px 40px; flex:1;}
@media (max-width:720px){ #content{padding:14px 14px 90px;} #topbar{padding:12px 14px; padding-top:calc(12px + var(--safe-top));} }

/* Mobile bottom tab bar */
#tabbar{display:none;}
@media (max-width:900px){
  #sidebar{display:none;}
  #tabbar{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(255,255,255,.92); backdrop-filter:blur(16px);
    border-top:1px solid var(--line); padding-bottom:var(--safe-bottom);
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 2px 8px; background:none; border:none; color:var(--text-3); font-size:10px; font-weight:600;
  }
  .tab-btn svg{width:22px; height:22px;}
  .tab-btn.active{color:var(--brass);}
}

/* ---------- Components ---------- */
.section-title{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
.kpi-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
.kpi-label{font-size:11px; color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.kpi-value{font-size:21px; font-weight:700; margin-top:6px; letter-spacing:-.01em;}
.kpi-sub{font-size:11px; color:var(--text-3); margin-top:3px;}
.pos{color:var(--income);} .neg{color:var(--expense);}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.card + .card{margin-top:14px;}
.card-head{padding:14px 16px 4px; font-size:14px; font-weight:700;}
.card-body{padding:8px 16px 14px;}

/* Pulse strip */
#pulse-wrap{background:var(--ink); border-radius:var(--radius); padding:14px 16px 10px; color:#fff; margin-bottom:14px;}
#pulse-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;}
#pulse-label{font-size:11px; color:#9AA3B0; font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
#pulse-value{font-size:22px; font-weight:700;}
#pulse-svg{width:100%; height:46px; display:block;}
.pulse-dot{animation:pulseAnim 1.8s ease-in-out infinite;}
@keyframes pulseAnim{0%,100%{r:3.4; opacity:1;} 50%{r:5.5; opacity:.55;}}

/* Lists / tables */
.row-list{display:flex; flex-direction:column;}
.row-item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.row-item:last-child{border-bottom:none;}
.row-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.row-checkbox{width:15px; height:15px; padding:0; border:1px solid var(--line); flex-shrink:0; margin:0; cursor:pointer;}
.row-main{flex:1; min-width:0;}
.row-title{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-sub{font-size:11.5px; color:var(--text-3); margin-top:1px;}
.row-amount{font-size:14px; font-weight:700; white-space:nowrap; flex-shrink:0;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px; font-size:10.5px; font-weight:700;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em;
  padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
tfoot td{padding:10px 10px; border-top:2px solid var(--line); white-space:nowrap;}
.right{text-align:right;}
.desktop-table{display:block;}
.mobile-cards{display:none;}
@media (max-width:720px){ .desktop-table{display:none;} .mobile-cards{display:block;} }

/* Forms */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:10px;}
input,select{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; font-size:13.5px;
  background:#fff; color:var(--text); font-family:inherit;
}
input:focus,select:focus{outline:none; border-color:var(--brass);}
.btn{
  padding:9px 16px; border-radius:9px; border:none; background:var(--ink); color:#fff; font-weight:600;
  font-size:13.5px; cursor:pointer;
}
.btn:active{opacity:.8;}
.btn-ghost{background:#fff; border:1px solid var(--line); color:var(--text);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}

.empty{padding:40px 16px; text-align:center; color:var(--text-3); font-size:13px;}

.modal-overlay{position:fixed; inset:0; background:rgba(18,24,31,.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
.modal-kutu{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; width:100%; max-width:640px; max-height:85vh; display:flex; flex-direction:column; overflow:auto;}
.modal-kutu.modal-kucuk{max-width:380px;}
.modal-baslik{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:15px;}
.modal-kutu textarea{flex:1; min-height:280px; width:100%; box-sizing:border-box; font-family:ui-monospace,Menlo,monospace; font-size:12px; padding:10px; border-radius:8px; border:1px solid var(--line); resize:vertical; background:var(--paper); color:var(--text);}

.badge-sube{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600;}
.badge-dot{width:6px; height:6px; border-radius:50%;}
.badge-durum{display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap;}

.branch-card{border-top:3px solid; border-radius:var(--radius); background:var(--card); border-left:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); box-shadow:var(--shadow); padding:14px 16px;}
.branch-card .name{font-weight:700; font-size:14px;}
.branch-kpi-row{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0;}

.urgent{color:var(--expense); font-weight:700;}
.soon{color:var(--brass); font-weight:600;}
.row-tamamlandi{opacity:.5;}

.list-manage{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.tag-chip{display:flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:5px 6px 5px 12px; font-size:12px;}
.tag-chip button{background:none; border:none; color:var(--text-3); cursor:pointer; font-size:14px; line-height:1; padding:2px 4px;}

.hint-box{background:var(--brass-soft); border:1px solid #E2CFA6; color:#6B4E1B; border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-bottom:14px;}

.export-toolbar{display:flex; gap:8px; margin-bottom:14px;}

@media print{
  #sidebar, #tabbar, #topbar, .export-toolbar,
  [id^="filtre-"], .btn, input, select{ display:none !important; }
  body, #paper, .card{ background:#fff !important; }
  #app{ display:block !important; }
  #main{ display:block !important; }
  #content{ padding:0 !important; }
  .card{ box-shadow:none !important; border:1px solid #ccc !important; break-inside:avoid; }
  #pulse-wrap{ background:#fff !important; color:#000 !important; border:1px solid #ccc; }
  #pulse-label, #pulse-value{ color:#000 !important; }
  .row-tamamlandi{ opacity:1 !important; }
  table{ font-size:11px; }
}
</style>
</head>

    <div id="content"></div>

</div>
