<title>Şube Ürün Talebi</title>
<style>
  :root{--ink:#111827;--paper:#F8F7F4;--brass:#B45309;--line:#E5E2DA;--muted:#6B7280;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 110px;}
  h1{font-size:19px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
  select,input[type=date],input[type=search],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit;}
  details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  summary{padding:13px 14px;font-size:14.5px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  summary::-webkit-details-marker{display:none;}
  summary .sayac{font-size:12px;font-weight:600;color:var(--muted);background:var(--paper);padding:2px 8px;border-radius:99px;}
  .kategori-icerik{padding:0 14px 6px;border-top:1px solid var(--line);}
  .urun-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:10px;}
  .urun-row:last-child{border-bottom:0;}
  .urun-row.gizli{display:none;}
  .urun-row.sube-gizli{display:none;}
  .urun-ad{font-size:13.5px;font-weight:500;}
  .urun-birim{font-size:11.5px;color:var(--muted);}
  .miktar-input{width:72px;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:center;font-family:inherit;flex-shrink:0;}
  .boylu-row{flex-direction:column;align-items:stretch;}
  .boy-grid{display:flex;gap:8px;margin-top:4px;}
  .boy-input{flex:1;text-align:center;}
  .boy-input label{margin:0 0 3px;font-size:10.5px;}
  .boy-input input{width:100%;padding:8px 4px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:center;font-family:inherit;}
  button{width:100%;padding:15px;margin-top:24px;background:var(--ink);color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.5;}
  .durum{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;text-align:center;display:none;}
  .durum.basarili{display:block;background:#ECFDF5;color:#065F46;}
  .durum.hata{display:block;background:#FEF2F2;color:#991B1B;}
  .ozet-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;font-size:13px;color:var(--muted);text-align:center;}
</style>
</head>

<div class="wrap">
  <h1>Şube Ürün Talebi</h1>

const params = new URLSearchParams(location.search);

const subeSelect = document.getElementById("sube");
SUBELER.forEach(s => {
  const o = document.createElement("option");
  o.value = s;
  o.textContent = s;
  subeSelect.appendChild(o);
});
const subeParam = params.get("sube");
if (subeParam && SUBELER.includes(subeParam)) {
  subeSelect.value = subeParam;
  subeSelect.disabled = true;
}

const tarihInput = document.getElementById("tarih");
const yarin = new Date();
yarin.setDate(yarin.getDate() + 1);
tarihInput.value = yarin.toISOString().slice(0, 10);

const kategorilerEl = document.getElementById("kategoriler");

KATALOG.forEach((kategori, ki) => {
  const det = document.createElement("details");
  const summary = document.createElement("summary");
  summary.innerHTML = `<span>${kategori.kategori}</span><span class="sayac">${kategori.urunler.length} ürün</span>`;
  det.appendChild(summary);

  const icerik = document.createElement("div");
  icerik.className = "kategori-icerik";

  kategori.urunler.forEach((urun, ui) => {
    const row = document.createElement("div");
    row.dataset.ad = urun.ad.toLocaleLowerCase("tr");
    row.dataset.gizliKey = kategori.kategori + "|" + urun.ad;

    if (kategori.boylu) {
      row.className = "urun-row boylu-row";
      let boyHtml = "";
      const boyMax = kategori.boyMax !== undefined ? kategori.boyMax : 3;
      for (let b = 0; b <= boyMax; b++) {
        boyHtml += `<div class="boy-input"><label>Boy ${b}</label><input type="number" min="0" inputmode="numeric" placeholder="0" data-ki="${ki}" data-ui="${ui}" data-boy="${b}"></div>`;
      }
      row.innerHTML = `<div class="urun-ad">${urun.ad}</div><div class="boy-grid">${boyHtml}</div>`;
    } else {
      row.className = "urun-row";
      row.innerHTML = `
        <div>
          <div class="urun-ad">${urun.ad}</div>
          <div class="urun-birim">${urun.birim}</div>
        </div>
        <input type="number" class="miktar-input" min="0" inputmode="numeric" placeholder="0" data-ki="${ki}" data-ui="${ui}">
      `;
    }
    icerik.appendChild(row);
  });

  det.appendChild(icerik);
  kategorilerEl.appendChild(det);
});

// Şubede satılmayan ürünleri gizler: sube-talep.html'e özgü, panel/rapor etkilenmez.
function subeGizlemeUygula() {
  const gizliSet = new Set(SUBE_GIZLI_URUNLER[subeSelect.value] || []);
  document.querySelectorAll(".kategori-icerik > div[data-gizli-key]").forEach(row => {
    row.classList.toggle("sube-gizli", gizliSet.has(row.dataset.gizliKey));
  });
  document.querySelectorAll("details").forEach(det => {
    const toplam = det.querySelectorAll(".kategori-icerik > div[data-gizli-key]").length;
    const gizli = det.querySelectorAll(".kategori-icerik > div.sube-gizli").length;
    const sayac = det.querySelector(".sayac");
    if (sayac) sayac.textContent = `${toplam - gizli} ürün`;
  });
}
subeSelect.addEventListener("change", subeGizlemeUygula);
subeGizlemeUygula();

const araInput = document.getElementById("ara");
araInput.addEventListener("input", () => {
  const q = araInput.value.trim().toLocaleLowerCase("tr");
  document.querySelectorAll(".kategori-icerik > div[data-ad]").forEach(row => {
    const eslesiyor = !q || row.dataset.ad.includes(q);
    row.classList.toggle("gizli", !eslesiyor);
  });
  document.querySelectorAll("details").forEach(det => {
    if (!q) { det.open = false; return; }
    const varMi = det.querySelectorAll(".kategori-icerik > div[data-ad]:not(.gizli):not(.sube-gizli)").length > 0;
    det.open = varMi;
    det.style.display = varMi ? "" : "none";
  });
  if (!q) {
    document.querySelectorAll("details").forEach(det => det.style.display = "");
  }
});

const durumEl = document.getElementById("durum");
const gonderBtn = document.getElementById("gonder");

gonderBtn.addEventListener("click", async () => {
  const sube = subeSelect.value;
  const tarih = tarihInput.value;
  const not = document.getElementById("not").value.trim();

  const kalemler = [];
  document.querySelectorAll('input[type=number][data-ki]').forEach(inp => {
    const miktar = parseFloat(inp.value);
    if (miktar > 0) {
      const kategori = KATALOG[inp.dataset.ki];
      const urun = kategori.urunler[inp.dataset.ui];
      const kalem = { kategori: kategori.kategori, urun: urun.ad, miktar, birim: urun.birim };
      if (inp.dataset.boy !== undefined) kalem.boy = inp.dataset.boy;
      kalemler.push(kalem);
    }
  });

  if (!sube || !tarih) {
    goster("hata", "Lütfen şube ve tarih seçin.");
    return;
  }
  if (kalemler.length === 0 && !not) {
    goster("hata", "En az bir ürün için miktar girin.");
    return;
  }
  if (APPS_SCRIPT_URL.includes("BURAYA_")) {
    goster("hata", "Kurulum tamamlanmadı: APPS_SCRIPT_URL henüz ayarlanmamış.");
    return;
  }

  gonderBtn.disabled = true;
  gonderBtn.textContent = "Gönderiliyor...";

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ sube, tarih, kalemler, not }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    goster("basarili", `Talebiniz gönderildi (${kalemler.length} kalem). Teşekkürler!`);
    document.querySelectorAll('input[type=number][data-ki]').forEach(inp => (inp.value = ""));
    document.getElementById("not").value = "";
  } catch (err) {
    goster("hata", "Gönderilemedi, internet bağlantınızı kontrol edip tekrar deneyin.");
  } finally {
    gonderBtn.disabled = false;
    gonderBtn.textContent = "Gönder";
  }
});

function goster(tur, mesaj) {
  durumEl.className = "durum " + tur;
  durumEl.textContent = mesaj;
}
