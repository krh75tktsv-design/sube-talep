<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maliyet+">
<title>Maliyet+ · Ürün Maliyet Analizi</title>
<style>
:root{
  --ink:#12181F;
  --ink-2:#1B232D;
  --paper:#F3F5F7;
  --card:#FFFFFF;
  --line:#E4E7EB;
  --text:#171B21;
  --text-2:#5B6472;
  --text-3:#8992A0;
  --brass:#AC7E32;
  --brass-soft:#F1E6D2;
  --income:#1C7A5E;
  --income-soft:#E3F1EC;
  --expense:#B03B32;
  --expense-soft:#FBE9E7;
  --warn:#B07A1E;
  --warn-soft:#FBF1DE;
  --shadow: 0 1px 2px rgba(18,24,31,.04), 0 8px 24px rgba(18,24,31,.06);
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper); color:var(--text); overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;}
.tabular{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:0;height:0;}

#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:230px; flex-shrink:0; background:var(--ink); color:#C7CDD6;
  display:flex; flex-direction:column;
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-name{color:#fff; font-size:18px; font-weight:700; letter-spacing:-.01em;}
.brand-name em{color:var(--brass); font-style:normal;}
.brand-sub{font-size:11px; color:#8891A0; margin-top:2px;}
#nav{flex:1; padding:10px 0;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 20px; font-size:13.5px;
  cursor:pointer; color:#C7CDD6; border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.04);}
.nav-item.active{background:rgba(255,255,255,.07); color:#fff; border-left-color:var(--brass); font-weight:600;}
.nav-ico{width:18px; text-align:center; font-size:14px;}
.side-foot{padding:14px 20px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:#7C8593;}

/* ---------- Main ---------- */
#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  background:var(--card); border-bottom:1px solid var(--line);
  padding:14px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:50;
}
#page-title{font-size:17px; font-weight:700; letter-spacing:-.01em;}
#page-sub{font-size:11.5px; color:var(--text-3); margin-top:1px;}
.top-actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
#content{padding:18px 22px 60px; flex:1;}

/* ---------- Bits ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.card + .card{margin-top:14px;}
.card-head{padding:14px 16px 4px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:10px;}
.card-head .hint{font-size:11.5px; color:var(--text-3); font-weight:500;}
.card-head .head-right{margin-left:auto; display:flex; gap:8px;}
.card-body{padding:8px 16px 14px;}
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px;}
.kpi-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
.kpi-label{font-size:11px; color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.kpi-value{font-size:21px; font-weight:700; margin-top:6px; letter-spacing:-.01em;}
.kpi-sub{font-size:11px; color:var(--text-3); margin-top:3px;}
.btn{padding:9px 16px; border-radius:9px; border:none; background:var(--ink); color:#fff; font-weight:600; font-size:13.5px; cursor:pointer;}
.btn:active{opacity:.8;}
.btn-ghost{background:#fff; border:1px solid var(--line); color:var(--text);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
.btn-danger{background:var(--expense-soft); color:var(--expense); border:1px solid #F2CFCB;}
.chip{
  padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
  font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}
.chip-row{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px; font-size:10.5px; font-weight:700;}
.pill-iyi{background:var(--income-soft); color:var(--income);}
.pill-orta{background:var(--warn-soft); color:var(--warn);}
.pill-kotu{background:var(--expense-soft); color:var(--expense);}
.pill-notr{background:var(--paper); color:var(--text-3);}
.bos{padding:26px 10px; text-align:center; color:var(--text-3); font-size:13px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em;
  padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-weight:600;
}
tbody td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody td.sag{white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
.sag{text-align:right;}
.tbl-wrap table{min-width:660px;}
.tbl-wrap{overflow-x:auto;}
.tbl-ad{font-weight:600;}
.tbl-alt{font-size:11px; color:var(--text-3); margin-top:1px;}
.satir-btn{background:none; border:none; cursor:pointer; font-size:14px; padding:2px 5px; color:var(--text-3);}
.satir-btn:hover{color:var(--text);}

label.alan{display:block; margin-bottom:10px;}
label.alan > span{display:block; font-size:11px; color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
input[type=text],input[type=number],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
  font-size:13.5px; background:#fff; color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brass);}
.alan-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0 12px;}

.modal-overlay{position:fixed; inset:0; background:rgba(18,24,31,.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
.modal-kutu{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; width:100%; max-width:720px; max-height:88vh; display:flex; flex-direction:column; overflow:auto;}
.modal-kutu.kucuk{max-width:420px;}
.modal-baslik{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; font-size:15px; font-weight:700;}
.modal-alt{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
.modal-kutu textarea{min-height:220px; font-family:ui-monospace,Menlo,monospace; font-size:12px; resize:vertical; background:var(--paper);}

.girdi-satir{display:grid; grid-template-columns:1fr 90px 80px 34px; gap:8px; align-items:center; margin-bottom:8px;}
.girdi-satir .tut{font-size:12px; color:var(--text-3); text-align:right; font-variant-numeric:tabular-nums;}
.girdi-baslik{display:grid; grid-template-columns:1fr 90px 80px 34px; gap:8px; font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-bottom:5px;}

.kirilim{display:flex; height:9px; border-radius:999px; overflow:hidden; background:var(--paper); margin:8px 0 5px;}
.kirilim > span{display:block;}
.kirilim-not{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--text-2);}
.kirilim-not i{width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px;}

/* Fiyat zinciri: maliyet → atölye → mağaza, aradaki marj ve kâr görünür */
.zincir{display:flex; align-items:stretch; gap:0; flex-wrap:wrap;}
.zincir-adim{flex:1 1 120px; min-width:110px; padding:10px 12px; background:var(--paper); border-radius:10px;}
.zincir-adim.son{background:var(--ink); color:#fff;}
.zincir-ad{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; color:var(--text-3);}
.zincir-adim.son .zincir-ad{color:#9AA3B0;}
.zincir-tut{font-size:16px; font-weight:700; margin-top:3px; white-space:nowrap;}
.zincir-ok{flex:0 1 96px; min-width:74px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 6px; gap:2px;}
.zincir-marj{font-size:11px; font-weight:700; color:var(--brass); white-space:nowrap;}
.zincir-cizgi{width:100%; height:1px; background:var(--line); position:relative;}
.zincir-cizgi::after{content:""; position:absolute; right:0; top:-3px; border-left:5px solid var(--line); border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;}
.zincir-kar{font-size:11px; color:var(--income); font-weight:600; white-space:nowrap;}
@media (max-width:560px){
  .zincir{flex-direction:column;}
  .zincir-ok{flex:none; width:100%; min-width:0; padding:6px 0;}
  .zincir-cizgi{width:1px; height:14px;}
  .zincir-cizgi::after{right:-3px; top:auto; bottom:0; border-left:3.5px solid transparent; border-right:3.5px solid transparent; border-top:5px solid var(--line); border-bottom:none;}
}

/* ---------- Mobil ---------- */
#mobil-nav{display:none;}
@media (max-width:820px){
  #sidebar{display:none;}
  #main{padding-bottom:calc(64px + var(--safe-bottom));}
  #topbar{padding:calc(10px + var(--safe-top)) 14px 12px;}
  #content{padding:14px 14px 40px;}
  #mobil-nav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:90;
    background:var(--card); border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
  }
  #mobil-nav .nav-item{
    flex:1; flex-direction:column; gap:3px; border-left:none; padding:9px 2px 7px;
    font-size:10.5px; color:var(--text-3); justify-content:center;
  }
  #mobil-nav .nav-item.active{background:none; color:var(--ink); font-weight:700;}
  #mobil-nav .nav-ico{font-size:17px;}
  .girdi-satir,.girdi-baslik{grid-template-columns:1fr 78px 68px 30px;}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-name">Maliyet<em>+</em></div>

    </div>
    <nav id="nav"></nav>
    <div class="side-foot">Veriler bu tarayıcıda saklanır.<br>Düzenli olarak CSV yedeği alın.</div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div>
        <div id="page-title">Analiz</div>
        <div id="page-sub"></div>
      </div>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <div id="content"></div>
  </div>
</div>
<nav id="mobil-nav"></nav>

/* ---------------- Depolama ---------------- */
function yukle(){
  try{
    const ham = localStorage.getItem(DEPO);
    if(!ham) return JSON.parse(JSON.stringify(BASLANGIC));
    const v = JSON.parse(ham);
    // Göç, varsayılanlarla birleştirmeden ÖNCE çalışmalı: birleştirme sonrası
    // yeni alan hep dolu görünür ve eski katsayı sessizce yok sayılırdı.
    const kayitliAyar = v.ayar || {};
    goceAyar(kayitliAyar);
    const d = {
      hammadde: Array.isArray(v.hammadde) ? v.hammadde : [],
      urun: Array.isArray(v.urun) ? v.urun : [],
      ayar: Object.assign({}, VARSAYILAN.ayar, kayitliAyar)
    };
    d.urun.forEach(goceUrun);
    return d;
  }catch(e){
    return JSON.parse(JSON.stringify(BASLANGIC));
  }
}
/* Eski kayıtlarda mağaza fiyatı bir katsayıydı (×2). Artık yüzde marj:
   katsayı 2 = %100 marj. Aynı fiyatı verir, tek seferlik çevrilir. */
function goceAyar(a){
  delete a.magazaKatsayi;
  delete a.varsayilanMagazaMarj;
}
function goceUrun(u){
  // Mağaza fiyatı artık sabit çarpanla bulunuyor; eski ürün bazlı alanlar atılır.
  delete u.magazaKat;
  delete u.magazaMarj;
}

function kaydet(){
  try{ localStorage.setItem(DEPO, JSON.stringify(DB)); }
  catch(e){ alert("Kaydedilemedi: tarayıcı deposu dolu olabilir."); }
}
function yeniId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------------- Biçimlendirme ---------------- */
function tl(n, basamak){
  if(!isFinite(n)) n = 0;
  const b = basamak === undefined ? 2 : basamak;
  return n.toLocaleString("tr-TR", {minimumFractionDigits:b, maximumFractionDigits:b}) + " ₺";
}
function yuzde(n){
  if(!isFinite(n)) n = 0;
  return n.toLocaleString("tr-TR", {minimumFractionDigits:1, maximumFractionDigits:1}) + "%";
}
function sayi(n, b){
  if(!isFinite(n)) n = 0;
  return n.toLocaleString("tr-TR", {minimumFractionDigits:0, maximumFractionDigits:(b===undefined?2:b)});
}
function kacir(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}
function num(v){ const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; }
function bugun(){ return new Date().toISOString().slice(0,10); }

/* ---------------- Hesap çekirdeği ---------------- */

// Girdi miktarını hammaddenin ana birimine çevirir (g → kg, ml → lt).
function anaBirime(miktar, birim){
  for(const grup of Object.values(BIRIMLER)){
    for(const [kod,, carpan] of grup.alt){
      if(kod === birim) return miktar * carpan;
    }
  }
  return miktar;
}

function hammaddeBul(id){ return DB.hammadde.find(h => h.id === id) || null; }
function urunBul(id){ return DB.urun.find(u => u.id === id) || null; }

/* Bir ürünün çıkan birimine uygun girdi birimlerini verir.
   "KG" cinsinden üretilen yarı mamul reçeteye gram olarak girer. */
function urunBirimGrubu(u){
  const b = (u && u.cikanBirim ? u.cikanBirim : "adet").toLocaleUpperCase("tr");
  if(b.includes("KG") || b.includes("GR")) return BIRIMLER.kg;
  if(b.includes("LT") || b.includes("ML")) return BIRIMLER.lt;
  return BIRIMLER.adet;
}

/*
  Bir ürünün maliyetini hesaplar. Girdi ya hammadde ya da başka bir ürün
  (yarı mamul) olabilir; yarı mamulün birim maliyeti özyineli hesaplanır.
  `zincir` aynı ürünün kendini dolaylı olarak içermesini (sonsuz döngü) engeller.
*/
function maliyetHesapla(u, zincir){
  zincir = zincir || [];
  const a = DB.ayar;
  let hammadde = 0;
  const girdiDetay = [];
  let eksikGirdi = false, donguVar = false;

  for(const g of (u.girdiler || [])){
    if(g.tip === "urun"){
      const alt = urunBul(g.uid);
      if(!alt){ eksikGirdi = true; continue; }
      if(zincir.includes(alt.id)){ donguVar = true; continue; }
      const ah = maliyetHesapla(alt, zincir.concat([u.id]));
      if(ah.donguVar) donguVar = true;
      // Yarı mamulün birim maliyeti onun çıkan birimi başınadır (TL/kg, TL/adet).
      const grup = urunBirimGrubu(alt);
      const carpan = (grup.alt.find(x => x[0] === g.birim) || [null,null,1])[2];
      const tutar = num(g.miktar) * carpan * ah.birimMaliyet;
      hammadde += tutar;
      girdiDetay.push({ad:alt.ad, miktar:num(g.miktar), birim:g.birim, tutar, yari:true, uid:alt.id});
      continue;
    }
    const h = hammaddeBul(g.hid);
    if(!h){ eksikGirdi = true; continue; }
    const anaMiktar = anaBirime(num(g.miktar), g.birim || h.birim);
    const fire = num(h.fire) / 100;
    const tutar = anaMiktar * num(h.fiyat) * (1 + fire);
    hammadde += tutar;
    girdiDetay.push({ad:h.ad, miktar:num(g.miktar), birim:g.birim || h.birim, tutar, yari:false});
  }

  const sure = num(u.sure);                       // parti başına üretim dakikası
  const iscilik = (sure / 60) * num(a.isciSaat);

  let genel = 0;
  if(a.genelYontem === "yuzde"){
    genel = hammadde * (num(a.genelYuzde) / 100);
  }else{
    const dkBasi = num(a.aylikUretimDk) > 0 ? num(a.aylikGenelGider) / num(a.aylikUretimDk) : 0;
    genel = sure * dkBasi;
  }

  const partiToplam = hammadde + iscilik + genel;

  // Üretim firesi çıkan adedi düşürür: 100 adet üretip %3 fire verirsen 97 satarsın.
  const cikanHam = num(u.cikan) || 1;
  const uretimFire = num(u.fire) / 100;
  const cikanNet = cikanHam * (1 - uretimFire);
  const adet = cikanNet > 0 ? cikanNet : cikanHam;

  const birimMaliyet = partiToplam / adet;

  /* Fiyat iki katmanda kurulur; her marj kendi tabanının üzerine eklenir:
       Atölye fiyatı = birim maliyet × (1 + atölye marjı)   ← üretimin kârı
       Mağaza fiyatı = atölye fiyatı × (1 + mağaza marjı)   ← şubenin kârı  */
  /* Fiyat iki yönden kurulabilir:
       "marj"  — marj sabit, atölye fiyatı ondan hesaplanır (varsayılan)
       "fiyat" — atölye fiyatı elle sabitlenmiş, marj ondan geri hesaplanır.
     İkincisinde maliyet arttıkça marj kendiliğinden erir; asıl uyarı budur. */
  const fiyattanMi = u.fiyatModu === "fiyat" && num(u.atolyeFiyat) > 0;
  let atolye, marjHedef;
  if(fiyattanMi){
    atolye = num(u.atolyeFiyat);
    marjHedef = birimMaliyet > 0 ? (atolye / birimMaliyet - 1) * 100 : 0;
  }else{
    marjHedef = u.hedefMarj === undefined || u.hedefMarj === "" ? num(a.varsayilanMarj) : num(u.hedefMarj);
    atolye = birimMaliyet * (1 + marjHedef/100);
  }
  const magaza = atolye * MAGAZA_CARPANI;
  const atolyeKar = atolye - birimMaliyet;   // üretimin kazandığı

  // Mevcut raf fiyatı karşılaştırması: gerçekte satılan fiyat esas alınır
  const satis = num(u.satisFiyat);
  const satisAtolye = satis > 0 ? satis / MAGAZA_CARPANI : 0;
  const kar = satis > 0 ? satis - birimMaliyet : 0;
  const gercekMarj = satis > 0 ? (kar / birimMaliyet) * 100 : 0;   // maliyet üzerine toplam kâr %
  const ciroMarj  = satis > 0 ? (kar / satis) * 100 : 0;           // ciro içindeki kâr payı

  return {
    hammadde, iscilik, genel, partiToplam,
    girdiDetay, eksikGirdi, donguVar,
    cikanNet: adet, birimMaliyet,
    marjHedef, atolye, magaza, atolyeKar, fiyattanMi,
    satis, satisAtolye, kar, gercekMarj, ciroMarj
  };
}

/* Atölye marjı: üretimin maliyet üzerine koyduğu pay. */
function atolyeMarjSinifi(m){
  if(!(m > 0)) return "pill-notr";
  if(m < 50)  return "pill-kotu";
  if(m < 100) return "pill-orta";
  return "pill-iyi";
}

/* Marj maliyet üzerine ilave (markup) olduğu için eşikler ona göre:
   %100 markup = fiyat maliyetin iki katı. */
function marjSinifi(m, satis){
  if(!satis) return {sinif:"pill-notr", ad:"fiyat yok"};
  if(m < 0) return {sinif:"pill-kotu", ad:"zarar"};
  if(m < 50) return {sinif:"pill-kotu", ad:"düşük"};
  if(m < 100) return {sinif:"pill-orta", ad:"orta"};
  return {sinif:"pill-iyi", ad:"iyi"};
}

function kategoriler(){
  const s = new Set();
  DB.urun.forEach(u => { if(u.kategori) s.add(u.kategori); });
  return [...s].sort((a,b) => a.localeCompare(b, "tr"));
}

function sayfaAnaliz(){

    // marjı yok, onlar listenin sonunda kendi aralarında ada göre sıralanır.
    .sort((a,b) => {
      if(a.u.yari !== b.u.yari) return a.u.yari ? 1 : -1;
      if(a.u.yari) return a.u.ad.localeCompare(b.u.ad, "tr");
      return a.h.marjHedef - b.h.marjHedef;

  const mal = fiyatli.reduce((t,x) => t + x.h.birimMaliyet, 0);

  const toplamHam = liste.reduce((t,x) => t + x.h.hammadde, 0);

  const toplamGen = liste.reduce((t,x) => t + x.h.genel, 0);
  const toplam = toplamHam + toplamIsc + toplamGen || 1;
  // İşçilik ve genel gider girilmediyse maliyet %100 hammaddedir; kırılımı
  // göstermek yer kaplamaktan başka bir şey söylemez.
  const kirilimVar = toplamIsc > 0 || toplamGen > 0;

  const kpi = `
    <div class="kpi-grid">

      </div>
      <div class="kpi-card">
        <div class="kpi-label">Zararına Satılan</div>
        <div class="kpi-value tabular" style="color:${zararli?"var(--expense)":"var(--income)"}">${zararli}</div>
        <div class="kpi-sub">${zararli?"fiyat gözden geçirilmeli":"tamamı maliyetin üstünde"}</div>
      </div>
      ${kirilimVar ? `<div class="kpi-card">
        <div class="kpi-label">Maliyet Kırılımı</div>
        <div class="kirilim">
          <span style="width:${toplamHam/toplam*100}%; background:var(--ink)"></span>
          <span style="width:${toplamIsc/toplam*100}%; background:var(--brass)"></span>
          <span style="width:${toplamGen/toplam*100}%; background:#B9C0CA"></span>
        </div>
        <div class="kirilim-not">
          <span><i style="background:var(--ink)"></i>Hammadde ${yuzde(toplamHam/toplam*100)}</span>
          <span><i style="background:var(--brass)"></i>İşçilik ${yuzde(toplamIsc/toplam*100)}</span>
          <span><i style="background:#B9C0CA"></i>Genel ${yuzde(toplamGen/toplam*100)}</span>
        </div>
      </div>` : `<div class="kpi-card">
        <div class="kpi-label">İşçilik + Genel Gider</div>
        <div class="kpi-value tabular" style="color:var(--warn)">Girilmedi</div>
        <div class="kpi-sub">maliyet şu an yalnızca hammadde · Ayarlar'dan tanımlayın</div>
      </div>`}
    </div>`;

  const kats = kategoriler();
  const chipler = `
    <div class="chip-row">
      <button class="chip ${kategoriFiltre==="hepsi"?"active":""}" data-kat="hepsi">Tümü</button>
      ${kats.map(k => `<button class="chip ${kategoriFiltre===k?"active":""}" data-kat="${kacir(k)}">${kacir(k)}</button>`).join("")}
    </div>`;

  const satirlar = liste.map(({u,h}) => {
    const ms = marjSinifi(h.gercekMarj, h.satis);
    // Mağaza fiyatının maliyet üzerine toplam marjı (atölye + mağaza katmanı birlikte)
    const magazaMarji = h.birimMaliyet > 0 ? (h.magaza - h.birimMaliyet) / h.birimMaliyet * 100 : 0;
    const etiket = u.yari
      ? ' <span class="pill pill-notr">yarı mamul</span>'
      : (h.eksikGirdi ? ' <span class="pill pill-kotu">girdi eksik</span>' : "")
        + (h.donguVar ? ' <span class="pill pill-kotu">döngü</span>' : "");
    return `<tr data-id="${u.id}" class="analiz-satir" style="cursor:pointer">
      <td>
        <div class="tbl-ad">${kacir(u.ad)}${etiket}</div>
        <div class="tbl-alt">${kacir(u.kategori||"—")} · ${sayi(h.cikanNet, h.cikanNet<10?1:0)} ${kacir(u.cikanBirim||"adet")} / parti</div>
      </td>
      ${kirilimVar ? `<td class="sag tabular">${tl(h.hammadde/h.cikanNet)}</td>
      <td class="sag tabular">${tl(h.iscilik/h.cikanNet)}</td>
      <td class="sag tabular">${tl(h.genel/h.cikanNet)}</td>` : ""}
      <td class="sag tabular" style="font-weight:700">${tl(h.birimMaliyet)}</td>
      <td class="sag tabular">${u.yari?"—":tl(h.atolye)}${!u.yari&&h.fiyattanMi?'<div class="tbl-alt">sabit fiyat</div>':""}</td>
      <td class="sag tabular">${u.yari?"—":tl(h.magaza)}
        ${u.yari?"":`<div class="tbl-alt">+${yuzde(magazaMarji)}</div>`}</td>
      <td class="sag tabular">${h.satis?tl(h.satis):"—"}
        ${h.satis && Math.abs(h.satis - h.magaza) >= 0.01
          ? `<div class="tbl-alt" style="color:${h.satis<h.magaza?"var(--expense)":"var(--income)"}">+${yuzde(h.gercekMarj)}</div>`
          : ""}</td>
      <td class="sag"><span class="pill ${u.yari?"pill-notr":atolyeMarjSinifi(h.marjHedef)}">${u.yari?"—":"+"+yuzde(h.marjHedef)}</span></td>
    </tr>`;
  }).join("");

  const tablo = liste.length ? `
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Ürün</th>
          ${kirilimVar ? `<th class="sag">Hammadde</th><th class="sag">İşçilik</th><th class="sag">Genel</th>` : ""}
          <th class="sag">Birim Maliyet</th>
          <th class="sag">Atölye Fiyatı</th>
          <th class="sag">Mağaza Fiyatı</th>
          <th class="sag">Mevcut Fiyat</th><th class="sag">Atölye Marjı</th>
        </tr></thead>
        <tbody>${satirlar}</tbody>
      </table>
    </div>` : `<div class="bos">Henüz ürün yok. <b>Reçeteler</b> sekmesinden ekleyin.</div>`;

  document.getElementById("content").innerHTML = kpi + chipler + `
    <div class="card">
      <div class="card-head">Ürün Maliyet Tablosu
        <span class="hint">birim başına · en dar atölye marjından sıralı · fiyatların altında maliyet üzerine marj</span>
      </div>
      <div class="card-body" style="padding-left:6px;padding-right:6px;">${tablo}</div>
    </div>`;

  document.querySelectorAll("[data-kat]").forEach(el => {
    el.addEventListener("click", () => { kategoriFiltre = el.dataset.kat; ciz(); });
  });
  document.querySelectorAll(".analiz-satir").forEach(el => {
    el.addEventListener("click", () => detayAc(el.dataset.id));
  });
  document.getElementById("a-csv").addEventListener("click", analizCsv);
}

function detayAc(id){
  const u = DB.urun.find(x => x.id === id);
  if(!u) return;
  const h = maliyetHesapla(u);
  const t = h.partiToplam || 1;

  const girdiler = h.girdiDetay.length
    ? h.girdiDetay.slice().sort((a,b) => b.tutar - a.tutar).map(g => `
      <tr${g.yari?' class="yari-satir" data-git="'+g.uid+'" style="cursor:pointer"':""}>
        <td>${kacir(g.ad)}${g.yari?' <span class="pill pill-notr">yarı mamul</span>':""}</td>
        <td class="sag tabular">${sayi(g.miktar)} ${kacir(g.birim)}</td>
        <td class="sag tabular">${tl(g.tutar)}</td>
        <td class="sag tabular" style="color:var(--text-3)">${yuzde(g.tutar/t*100)}</td>
      </tr>`).join("")
    : `<tr><td colspan="4" class="bos">Girdi tanımlı değil.</td></tr>`;

  // Bu ürünü girdi olarak kullanan reçeteler
  const kullanan = DB.urun.filter(x => (x.girdiler||[]).some(g => g.tip === "urun" && g.uid === u.id));

  modalAc(`
    <div class="modal-baslik">
      <span>${kacir(u.ad)}${u.yari?' <span class="pill pill-notr">yarı mamul</span>':""}</span>
      <button class="btn btn-ghost btn-sm" data-kapat>Kapat ✕</button>
    </div>
    ${h.donguVar?`<div style="background:var(--expense-soft);color:var(--expense);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:10px">
      Dikkat: bu reçete dolaylı olarak kendini girdi alıyor. Döngüye giren girdi maliyete katılmadı.</div>`:""}
    <div class="kpi-grid" style="margin-bottom:10px">
      <div class="kpi-card"><div class="kpi-label">Birim Maliyet</div><div class="kpi-value tabular">${tl(h.birimMaliyet)}</div><div class="kpi-sub">${sayi(h.cikanNet, h.cikanNet<10?1:0)} ${kacir(u.cikanBirim||"adet")} / parti</div></div>
      ${u.yari
        ? `<div class="kpi-card"><div class="kpi-label">Kullanıldığı Reçete</div><div class="kpi-value tabular">${kullanan.length}</div><div class="kpi-sub">${kullanan.slice(0,3).map(x=>kacir(x.ad)).join(", ")||"henüz kullanılmıyor"}</div></div>`
        : `<div class="kpi-card"><div class="kpi-label">Atölye Fiyatı</div><div class="kpi-value tabular">${tl(h.atolye)}</div><div class="kpi-sub">${h.fiyattanMi?"elle sabit · marj ":"%"}${h.fiyattanMi?yuzde(h.marjHedef):sayi(h.marjHedef,1)+" marj"} · ${tl(h.atolyeKar)} kâr</div></div>
           <div class="kpi-card"><div class="kpi-label">Mağaza Fiyatı</div><div class="kpi-value tabular">${tl(h.magaza)}</div><div class="kpi-sub">atölye × ${sayi(MAGAZA_CARPANI,2)}</div></div>`}
      <div class="kpi-card"><div class="kpi-label">Mevcut Kâr</div><div class="kpi-value tabular" style="color:${h.kar<0?"var(--expense)":"var(--income)"}">${h.satis?tl(h.kar):"—"}</div><div class="kpi-sub">${h.satis?"maliyet üzerine "+yuzde(h.gercekMarj):"mevcut fiyat girilmemiş"}</div></div>
    </div>
    ${u.yari ? "" : `
    <div class="card"><div class="card-head">Fiyat Zinciri <span class="hint">birim başına · her marj kendi tabanının üzerine</span></div>
      <div class="card-body">
        <div class="zincir">
          <div class="zincir-adim">
            <div class="zincir-ad">Birim maliyet</div>
            <div class="zincir-tut tabular">${tl(h.birimMaliyet)}</div>
          </div>
          <div class="zincir-ok">
            <div class="zincir-marj">${h.fiyattanMi?"= ":"+ "}${yuzde(h.marjHedef)}</div>
            <div class="zincir-cizgi"></div>
            <div class="zincir-kar tabular">${tl(h.atolyeKar)}</div>
          </div>
          <div class="zincir-adim">
            <div class="zincir-ad">Atölye fiyatı</div>
            <div class="zincir-tut tabular">${tl(h.atolye)}</div>
          </div>
          <div class="zincir-ok">
            <div class="zincir-marj">× ${sayi(MAGAZA_CARPANI,2)}</div>
            <div class="zincir-cizgi"></div>
            <div class="zincir-kar tabular">sabit</div>
          </div>
          <div class="zincir-adim son">
            <div class="zincir-ad">Mağaza fiyatı</div>
            <div class="zincir-tut tabular">${tl(h.magaza)}</div>
          </div>
        </div>
        <div class="kirilim-not" style="margin-top:12px">
          <span><b>Atölye kârı</b> ${tl(h.atolyeKar)}</span>
          <span style="color:var(--text-3)">Mağaza fiyatı atölyenin ${sayi(MAGAZA_CARPANI,2)} katı</span>
        </div>
        ${h.satis ? (() => {
          const fark = h.satis - h.magaza;
          const ayni = Math.abs(fark) < 0.01;
          return `<div style="margin-top:10px;padding:9px 12px;background:var(--paper);border-radius:9px;font-size:12.5px;color:var(--text-2);line-height:1.6">
            Rafta gerçekte <b>${tl(h.satis)}</b> satılıyor — ${ayni
              ? "hesaplanan mağaza fiyatıyla aynı"
              : `hesaplanan mağaza fiyatından <b style="color:${fark<0?"var(--expense)":"var(--income)"}">${tl(Math.abs(fark))} ${fark<0?"düşük":"yüksek"}</b>`}.
            Bu fiyatta şubeye giriş ${tl(h.satisAtolye)}, maliyet üzerine toplam kâr ${yuzde(h.gercekMarj)}.
          </div>`;
        })() : ""}
      </div>
    </div>`}
    ${(h.iscilik > 0 || h.genel > 0) ? `
    <div class="card"><div class="card-head">Parti Maliyeti <span class="hint">${sayi(num(u.cikan),0)} ${kacir(u.cikanBirim||"adet")} üretim · ${sayi(num(u.sure),0)} dk</span></div>
      <div class="card-body">
        <div class="kirilim">
          <span style="width:${h.hammadde/t*100}%; background:var(--ink)"></span>
          <span style="width:${h.iscilik/t*100}%; background:var(--brass)"></span>
          <span style="width:${h.genel/t*100}%; background:#B9C0CA"></span>
        </div>
        <div class="kirilim-not">
          <span><i style="background:var(--ink)"></i>Hammadde ${tl(h.hammadde)}</span>
          <span><i style="background:var(--brass)"></i>İşçilik ${tl(h.iscilik)}</span>
          <span><i style="background:#B9C0CA"></i>Genel gider ${tl(h.genel)}</span>
          <span style="font-weight:700;color:var(--text)">Toplam ${tl(h.partiToplam)}</span>
        </div>
      </div>
    </div>` : ""}
    <div class="card"><div class="card-head">Girdiler <span class="hint">fire dahil · pahalıdan ucuza · yarı mamule tıklayın</span></div>
      <div class="card-body" style="padding-left:6px;padding-right:6px;">
        <div class="tbl-wrap"><table>
          <thead><tr><th>Hammadde</th><th class="sag">Miktar</th><th class="sag">Tutar</th><th class="sag">Pay</th></tr></thead>
          <tbody>${girdiler}</tbody>
        </table></div>
      </div>
    </div>
    <div class="modal-alt">
      <button class="btn btn-ghost" data-kapat>Kapat</button>
      <button class="btn" id="detay-duzenle">Reçeteyi Düzenle</button>
    </div>
  `, ov => {
    ov.querySelector("#detay-duzenle").addEventListener("click", () => {
      ov.remove(); sayfa = "receteler"; ciz(); receteFormu(u.id);
    });
    // Yarı mamul girdisine tıklayınca onun kendi maliyet detayına in
    ov.querySelectorAll(".yari-satir").forEach(tr => tr.addEventListener("click", () => {
      ov.remove(); detayAc(tr.dataset.git);
    }));
  });
}

function analizCsv(){
  const basliklar = ["Ürün","Kategori","Tür","Parti Çıkan","Birim","Süre (dk)","Hammadde/birim","İşçilik/birim","Genel/birim","Birim Maliyet","Atölye Marjı %","Atölye Fiyatı","Atölye Kârı","Mağaza Fiyatı","Mevcut Fiyat","Mevcut Fiyatta Kâr","Toplam Marj %"];
  const satirlar = DB.urun.map(u => {
    const h = maliyetHesapla(u);
    return [
      u.ad, u.kategori||"", u.yari?"yarı mamul":"ürün", h.cikanNet.toFixed(2), u.cikanBirim||"adet", num(u.sure),
      (h.hammadde/h.cikanNet).toFixed(4), (h.iscilik/h.cikanNet).toFixed(4), (h.genel/h.cikanNet).toFixed(4),
      h.birimMaliyet.toFixed(4),
      u.yari?"":h.marjHedef, u.yari?"":h.atolye.toFixed(2), u.yari?"":h.atolyeKar.toFixed(2),
      u.yari?"":h.magaza.toFixed(2),
      h.satis || "", h.satis ? h.kar.toFixed(2) : "", h.satis ? h.gercekMarj.toFixed(1) : ""
    ];
  });
  csvIndir(`maliyet-analiz-${bugun()}.csv`, basliklar, satirlar);
}

/* ---------------- Sayfa: Reçeteler ---------------- */
function sayfaReceteler(){
  document.getElementById("top-actions").innerHTML = `
    <button class="btn btn-ghost btn-sm" id="r-csv">⬇ CSV İndir</button>
    <button class="btn btn-sm" id="r-ekle">+ Yeni Reçete</button>`;

  const fireVar = DB.urun.some(u => num(u.fire) > 0);
  const q = urunAra.toLocaleLowerCase("tr");
  const liste = DB.urun
    .filter(u => !q || (u.ad||"").toLocaleLowerCase("tr").includes(q) || (u.kategori||"").toLocaleLowerCase("tr").includes(q))
    .sort((a,b) => (a.kategori||"").localeCompare(b.kategori||"","tr") || (a.ad||"").localeCompare(b.ad||"","tr"));

  const satirlar = liste.map(u => {
    const h = maliyetHesapla(u);
    return `<tr>
      <td>
        <div class="tbl-ad">${kacir(u.ad)}${u.yari?' <span class="pill pill-notr">yarı mamul</span>':""}</div>
        <div class="tbl-alt">${kacir(u.kategori||"—")} · ${(u.girdiler||[]).length} girdi · ${sayi(num(u.sure),0)} dk</div>
      </td>
      <td class="sag tabular">${sayi(num(u.cikan),0)} ${kacir(u.cikanBirim||"adet")}</td>
      ${fireVar ? `<td class="sag tabular">${num(u.fire)?yuzde(num(u.fire)):"—"}</td>` : ""}
      <td class="sag tabular" style="font-weight:700">${tl(h.birimMaliyet)}</td>
      <td class="sag tabular">${h.satis?tl(h.satis):"—"}</td>
      <td class="sag" style="white-space:nowrap">
        <button class="satir-btn" data-duzenle="${u.id}" title="Düzenle">✎</button>
        <button class="satir-btn" data-kopya="${u.id}" title="Kopyala">⧉</button>
        <button class="satir-btn" data-sil="${u.id}" title="Sil">🗑</button>
      </td>
    </tr>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-head">Reçeteler <span class="hint">${DB.urun.length} ürün</span>
        <div class="head-right" style="min-width:200px">
          <input type="text" id="r-ara" placeholder="Ürün ara…" value="${kacir(urunAra)}">
        </div>
      </div>
      <div class="card-body" style="padding-left:6px;padding-right:6px;">
        ${liste.length ? `<div class="tbl-wrap"><table>
          <thead><tr><th>Ürün</th><th class="sag">Parti</th>${fireVar?`<th class="sag">Fire</th>`:""}<th class="sag">Birim Maliyet</th><th class="sag">Mağaza</th><th></th></tr></thead>
          <tbody>${satirlar}</tbody></table></div>`
          : `<div class="bos">${DB.urun.length?"Aramaya uyan ürün yok.":"Henüz reçete yok. <b>+ Yeni Reçete</b> ile başlayın."}</div>`}
      </div>
    </div>`;

  const ara = document.getElementById("r-ara");
  ara.addEventListener("input", () => {
    urunAra = ara.value;
    const k = ara.selectionStart;
    sayfaReceteler();
    const y = document.getElementById("r-ara"); y.focus(); y.setSelectionRange(k,k);
  });
  document.getElementById("r-ekle").addEventListener("click", () => receteFormu(null));
  document.getElementById("r-csv").addEventListener("click", receteCsv);
  document.querySelectorAll("[data-duzenle]").forEach(b => b.addEventListener("click", () => receteFormu(b.dataset.duzenle)));
  document.querySelectorAll("[data-kopya]").forEach(b => b.addEventListener("click", () => receteKopyala(b.dataset.kopya)));
  document.querySelectorAll("[data-sil]").forEach(b => b.addEventListener("click", () => receteSil(b.dataset.sil)));

function receteKopyala(id){
  const u = DB.urun.find(x => x.id === id);
  if(!u) return;
  const k = JSON.parse(JSON.stringify(u));
  k.id = yeniId();
  k.ad = u.ad + " (kopya)";
  DB.urun.push(k); kaydet(); ciz(); receteFormu(k.id);
}

function receteSil(id){
  const u = DB.urun.find(x => x.id === id);
  if(!u) return;
  const kullanan = DB.urun.filter(x => (x.girdiler||[]).some(g => g.tip === "urun" && g.uid === id));
  const uyari = kullanan.length
    ? `\n\nDikkat: ${kullanan.length} reçetede yarı mamul olarak kullanılıyor `
      + `(${kullanan.slice(0,3).map(x=>x.ad).join(", ")}${kullanan.length>3?"…":""}). `
      + `Bu reçetelerin maliyeti eksik hesaplanır.`
    : "";
  if(!confirm(`"${u.ad}" reçetesi silinsin mi?${uyari}`)) return;
  DB.urun = DB.urun.filter(x => x.id !== id);
  kaydet(); ciz();
}

function receteFormu(id){
  const yeni = !id;
  const u = yeni
    ? {id:yeniId(), ad:"", kategori:"", cikan:1, cikanBirim:"adet", sure:0, fire:0,
       satisFiyat:"", hedefMarj:"", fiyatModu:"marj", atolyeFiyat:"", yari:false, girdiler:[]}
    : JSON.parse(JSON.stringify(DB.urun.find(x => x.id === id)));
  if(!u) return;
  if(!u.girdiler.length) u.girdiler.push({tip:"ham", hid:"", miktar:"", birim:""});

  // Girdi seçiminde hammaddeler ve (bu ürünün kendisi hariç) yarı mamuller listelenir.
  const girdiSecenek = (g) => {
    const secili = g.tip === "urun" ? "u:"+g.uid : "h:"+g.hid;
    const hams = DB.hammadde.slice().sort((a,b) => a.ad.localeCompare(b.ad,"tr"))
      .map(h => `<option value="h:${h.id}" ${("h:"+h.id)===secili?"selected":""}>${kacir(h.ad)} · ${tl(num(h.fiyat))}/${h.birim}</option>`).join("");
    const yariler = DB.urun.filter(x => x.id !== u.id).sort((a,b) => a.ad.localeCompare(b.ad,"tr"))
      .map(x => {
        const bm = maliyetHesapla(x).birimMaliyet;
        return `<option value="u:${x.id}" ${("u:"+x.id)===secili?"selected":""}>${kacir(x.ad)} · ${tl(bm)}/${kacir(x.cikanBirim||"adet")}</option>`;
      }).join("");
    return `<option value="">Seçin…</option>`
      + (hams ? `<optgroup label="Hammadde">${hams}</optgroup>` : "")
      + (yariler ? `<optgroup label="Yarı mamul / ürün">${yariler}</optgroup>` : "");
  };
  const birimSecenek = (deger, secili) => {
    let grup = null;
    if(deger && deger.startsWith("h:")){
      const h = hammaddeBul(deger.slice(2)); grup = h ? BIRIMLER[h.birim] : null;
    }else if(deger && deger.startsWith("u:")){
      const x = urunBul(deger.slice(2)); grup = x ? urunBirimGrubu(x) : null;
    }
    if(!grup) return `<option value="">—</option>`;
    return grup.alt.map(([kod,ad]) => `<option value="${kod}" ${kod===secili?"selected":""}>${ad}</option>`).join("");
  };

  const girdiHtml = (g,i) => `
    <div class="girdi-satir" data-i="${i}">
      <select data-g="kaynak">${girdiSecenek(g)}</select>
      <input type="number" step="any" data-g="miktar" placeholder="0" value="${g.miktar===""?"":num(g.miktar)}">
      <select data-g="birim">${birimSecenek(g.tip==="urun"?"u:"+g.uid:"h:"+g.hid, g.birim)}</select>

      <button class="btn btn-ghost btn-sm" data-kapat>✕</button>
    </div>
    <div class="alan-grid">
      <label class="alan"><span>Ürün adı</span><input type="text" id="f-ad" value="${kacir(u.ad)}" placeholder="Örn. Susamlı Simit"></label>
      <label class="alan"><span>Kategori</span><input type="text" id="f-kategori" value="${kacir(u.kategori)}" placeholder="Örn. Fırın"></label>
    </div>
    <div class="alan-grid">
      <label class="alan"><span>Parti çıkan miktar</span><input type="number" step="any" id="f-cikan" value="${num(u.cikan)}"></label>
      <label class="alan"><span>Çıkan birimi</span><input type="text" id="f-cikanbirim" value="${kacir(u.cikanBirim||"adet")}" placeholder="adet / kg / tepsi"></label>
      <label class="alan"><span>Üretim süresi (dk)</span><input type="number" step="any" id="f-sure" value="${num(u.sure)}"></label>
      <label class="alan"><span>Üretim firesi (%)</span><input type="number" step="any" id="f-fire" value="${num(u.fire)}"></label>
    </div>
    <div class="alan-grid">
      <label class="alan"><span>Mevcut mağaza fiyatı (₺)</span><input type="number" step="any" id="f-satis" value="${u.satisFiyat===""?"":num(u.satisFiyat)}" placeholder="boş bırakılabilir"></label>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="card-head">Atölye Fiyatı
        <span class="hint">birini yazın, diğeri hesaplansın</span>
      </div>
      <div class="card-body">
        <div class="alan-grid">
          <label class="alan"><span>Kâr marjı (%)</span>
            <input type="number" step="any" id="f-marj" value="${u.hedefMarj===""||u.hedefMarj===undefined?"":num(u.hedefMarj)}" placeholder="varsayılan ${sayi(num(DB.ayar.varsayilanMarj),0)}"></label>
          <label class="alan"><span>Satış fiyatı (₺)</span>
            <input type="number" step="any" id="f-afiyat" value="${num(u.atolyeFiyat)?num(u.atolyeFiyat):""}" placeholder="0,00"></label>
        </div>
        <div id="f-fiyat-not" style="font-size:11.5px;color:var(--text-3);line-height:1.5"></div>
      </div>
    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:12px; cursor:pointer;">
      <input type="checkbox" id="f-yari" ${u.yari?"checked":""} style="width:auto; margin:0;">
      <span>Bu bir <b>yarı mamul</b> (ganaj, pandispanya, sos gibi — tek başına satılmaz, başka reçetelerde girdi olur)</span>
    </label>

    <div class="card" style="margin-top:6px">
      <div class="card-head">Girdiler
        <div class="head-right"><button class="btn btn-ghost btn-sm" id="f-girdi-ekle">+ Girdi</button></div>
      </div>
      <div class="card-body">
        <div class="girdi-baslik"><span>Hammadde</span><span>Miktar</span><span>Birim</span><span></span></div>
        <div id="f-girdiler">${u.girdiler.map(girdiHtml).join("")}</div>
        <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:flex; justify-content:space-between; font-size:13px;">
          <span style="color:var(--text-2)">Tahmini birim maliyet</span>
          <b class="tabular" id="f-ozet">—</b>
        </div>
      </div>
    </div>

    <div class="modal-alt">
      ${yeni?"":`<button class="btn btn-danger btn-sm" id="f-sil" style="margin-right:auto">Sil</button>`}
      <button class="btn btn-ghost" data-kapat>Vazgeç</button>
      <button class="btn" id="f-kaydet">Kaydet</button>
    </div>
  `, ov => {
    const girdiKutu = ov.querySelector("#f-girdiler");
    let fiyatKaynak = (u.fiyatModu === "fiyat" && num(u.atolyeFiyat) > 0) ? "fiyat" : "marj";

    function oku(){
      u.ad = ov.querySelector("#f-ad").value.trim();
      u.kategori = ov.querySelector("#f-kategori").value.trim();
      u.cikan = num(ov.querySelector("#f-cikan").value);
      u.cikanBirim = ov.querySelector("#f-cikanbirim").value.trim() || "adet";
      u.sure = num(ov.querySelector("#f-sure").value);
      u.fire = num(ov.querySelector("#f-fire").value);
      const s = ov.querySelector("#f-satis").value.trim();
      u.satisFiyat = s === "" ? "" : num(s);
      const m = ov.querySelector("#f-marj").value.trim();
      u.hedefMarj = m === "" ? "" : num(m);
      u.fiyatModu = fiyatKaynak;
      u.atolyeFiyat = fiyatKaynak === "fiyat" ? num(ov.querySelector("#f-afiyat").value) : "";
      u.yari = ov.querySelector("#f-yari").checked;
      u.girdiler = [...girdiKutu.querySelectorAll(".girdi-satir")].map(r => {
        const kaynak = r.querySelector('[data-g="kaynak"]').value;
        const g = {
          miktar: r.querySelector('[data-g="miktar"]').value,
          birim: r.querySelector('[data-g="birim"]').value
        };
        if(kaynak.startsWith("u:")){ g.tip = "urun"; g.uid = kaynak.slice(2); }
        else { g.tip = "ham"; g.hid = kaynak.slice(2); }
        return g;
      });
    }
    function ozetle(){
      oku();
      const h = maliyetHesapla(u);
      ov.querySelector("#f-ozet").textContent =
        `${tl(h.birimMaliyet)}  ·  parti ${tl(h.partiToplam)}`;

      // Yazılmayan alanı hesaplanan değerle doldur (value ataması input olayı
      // tetiklemez, döngü oluşmaz).
      const marjEl = ov.querySelector("#f-marj");
      const fiyatEl = ov.querySelector("#f-afiyat");
      const not = ov.querySelector("#f-fiyat-not");
      if(fiyatKaynak === "fiyat"){
        marjEl.value = isFinite(h.marjHedef) ? h.marjHedef.toFixed(1) : "";
        marjEl.style.color = "var(--text-3)";
        fiyatEl.style.color = "";
        not.innerHTML = h.birimMaliyet > 0
          ? `Fiyat sabit, marj hesaplandı. Mağaza fiyatı <b>${tl(h.magaza)}</b>.
             Maliyet artarsa bu marj kendiliğinden düşer.`
          : `Maliyet sıfır olduğu için marj hesaplanamıyor — önce girdileri tanımlayın.`;
      }else{
        fiyatEl.value = h.atolye ? h.atolye.toFixed(2) : "";
        fiyatEl.style.color = "var(--text-3)";
        marjEl.style.color = "";
        not.innerHTML = `Marj sabit, fiyat hesaplandı. Mağaza fiyatı <b>${tl(h.magaza)}</b>.
             Maliyet artarsa fiyat da yükselir.`;
      }
    }
    function girdileriBagla(){
      girdiKutu.querySelectorAll('[data-g="kaynak"]').forEach(sel => {
        sel.addEventListener("change", () => {
          const satir = sel.closest(".girdi-satir");
          const bs = satir.querySelector('[data-g="birim"]');
          bs.innerHTML = birimSecenek(sel.value, "");
          ozetle();
        });
      });
      girdiKutu.querySelectorAll('[data-g="miktar"],[data-g="birim"]').forEach(el => {
        el.addEventListener("input", ozetle);
        el.addEventListener("change", ozetle);
      });
      girdiKutu.querySelectorAll("[data-g-sil]").forEach(b => {
        b.addEventListener("click", () => {
          if(girdiKutu.querySelectorAll(".girdi-satir").length <= 1) return;
          b.closest(".girdi-satir").remove();
          ozetle();
        });
      });
    }
    girdileriBagla();
    ov.querySelectorAll("#f-cikan,#f-cikanbirim,#f-sure,#f-fire,#f-satis").forEach(el => el.addEventListener("input", ozetle));
    // Son yazılan alan kaynak olur, diğeri hesaplanır.
    ov.querySelector("#f-marj").addEventListener("input", () => { fiyatKaynak = "marj"; ozetle(); });
    ov.querySelector("#f-afiyat").addEventListener("input", () => { fiyatKaynak = "fiyat"; ozetle(); });
    ozetle();

    ov.querySelector("#f-girdi-ekle").addEventListener("click", () => {
      const i = girdiKutu.querySelectorAll(".girdi-satir").length;
      girdiKutu.insertAdjacentHTML("beforeend", girdiHtml({tip:"ham",hid:"",miktar:"",birim:""}, i));
      girdileriBagla();
    });

    ov.querySelector("#f-kaydet").addEventListener("click", () => {
      oku();
      if(!u.ad){ alert("Ürün adı gerekli."); return; }
      if(!(u.cikan > 0)){ alert("Parti çıkan miktarı sıfırdan büyük olmalı."); return; }
      u.girdiler = u.girdiler.filter(g => (g.tip==="urun" ? g.uid : g.hid) && num(g.miktar) > 0);
      if(maliyetHesapla(u).donguVar){
        alert("Bu reçete dolaylı olarak kendini girdi alıyor. Yarı mamul seçimini gözden geçirin.");
        return;
      }
      const mevcut = DB.urun.findIndex(x => x.id === u.id);
      if(mevcut >= 0) DB.urun[mevcut] = u; else DB.urun.push(u);
      kaydet(); ov.remove(); ciz();
    });

    const silBtn = ov.querySelector("#f-sil");
    if(silBtn) silBtn.addEventListener("click", () => {
      if(!confirm(`"${u.ad}" reçetesi silinsin mi?`)) return;
      DB.urun = DB.urun.filter(x => x.id !== u.id);
      kaydet(); ov.remove(); ciz();
    });
  });
}

function receteCsv(){
  const basliklar = ["Ürün","Kategori","Tür","Parti Çıkan","Birim","Süre (dk)","Fire %","Mevcut Fiyat","Fiyatlama","Atölye Marjı %","Atölye Fiyatı","Girdi","Girdi Türü","Miktar","Girdi Birimi"];
  const satirlar = [];
  DB.urun.forEach(u => {
    const ortak = [u.ad, u.kategori||"", u.yari?"yarı mamul":"ürün", num(u.cikan), u.cikanBirim||"adet", num(u.sure), num(u.fire), u.satisFiyat||"", u.fiyatModu==="fiyat"?"sabit fiyat":"sabit marj", u.hedefMarj===""?"":u.hedefMarj, num(u.atolyeFiyat)||""];
    if(!(u.girdiler||[]).length){ satirlar.push(ortak.concat(["","","",""])); return; }
    u.girdiler.forEach(g => {
      const k = g.tip === "urun" ? urunBul(g.uid) : hammaddeBul(g.hid);
      satirlar.push(ortak.concat([k?k.ad:"(silinmiş)", g.tip==="urun"?"yarı mamul":"hammadde", num(g.miktar), g.birim||""]));
    });
  });
  csvIndir(`receteler-${bugun()}.csv`, basliklar, satirlar);
}

      <td>${kacir(h.birim)}</td>
      ${fireVar ? `<td class="sag tabular">${num(h.fire)?yuzde(num(h.fire)):"—"}</td>
      <td class="sag tabular" style="color:var(--text-2)">${tl(num(h.fiyat)*(1+num(h.fire)/100))}</td>` : ""}
      <td class="sag" style="white-space:nowrap">
        <button class="satir-btn" data-hduzenle="${h.id}" title="Düzenle">✎</button>
        <button class="satir-btn" data-hsil="${h.id}" title="Sil">🗑</button>
      </td>

  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="card-head">Hammaddeler <span class="hint">${DB.hammadde.length} girdi</span>
        <div class="head-right" style="min-width:200px">
          <input type="text" id="h-ara" placeholder="Hammadde ara…" value="${kacir(hamAra)}">
        </div>
      </div>
      <div class="card-body" style="padding-left:6px;padding-right:6px;">
        ${liste.length ? `<div class="tbl-wrap"><table>
          <thead><tr><th>Hammadde</th><th class="sag">Birim Fiyat</th><th>Birim</th>${fireVar?`<th class="sag">Fire</th><th class="sag">Fireli</th>`:""}<th></th></tr></thead>
          <tbody>${satirlar}</tbody></table></div>`
          : `<div class="bos">${DB.hammadde.length?"Aramaya uyan hammadde yok.":"Henüz hammadde yok. Reçete girmeden önce buradan girdileri tanımlayın."}</div>`}
      </div>
    </div>`;

  const ara = document.getElementById("h-ara");
  ara.addEventListener("input", () => {
    hamAra = ara.value;
    const k = ara.selectionStart;
    sayfaHammadde();
    const y = document.getElementById("h-ara"); y.focus(); y.setSelectionRange(k,k);
  });
  document.getElementById("h-ekle").addEventListener("click", () => hammaddeFormu(null));
  document.getElementById("h-toplu").addEventListener("click", hammaddeToplu);
  document.getElementById("h-csv").addEventListener("click", hammaddeCsv);
  document.querySelectorAll("[data-hduzenle]").forEach(b => b.addEventListener("click", () => hammaddeFormu(b.dataset.hduzenle)));
  document.querySelectorAll("[data-hsil]").forEach(b => b.addEventListener("click", () => hammaddeSil(b.dataset.hsil)));

function hammaddeSil(id){
  const h = hammaddeBul(id);
  if(!h) return;
  const kullanan = DB.urun.filter(u => (u.girdiler||[]).some(g => g.tip !== "urun" && g.hid === id));
  const uyari = kullanan.length
    ? `\n\nDikkat: ${kullanan.length} reçetede kullanılıyor (${kullanan.slice(0,3).map(u=>u.ad).join(", ")}${kullanan.length>3?"…":""}). Bu reçetelerin maliyeti eksik hesaplanır.`
    : "";
  if(!confirm(`"${h.ad}" silinsin mi?${uyari}`)) return;
  DB.hammadde = DB.hammadde.filter(x => x.id !== id);
  kaydet(); ciz();
}

function hammaddeFormu(id){
  const yeni = !id;
  const h = yeni
    ? {id:yeniId(), ad:"", birim:"kg", fiyat:0, fire:0, tedarikci:""}
    : JSON.parse(JSON.stringify(hammaddeBul(id)));
  if(!h) return;

  modalAc(`
    <div class="modal-baslik">
      <span>${yeni?"Yeni Hammadde":"Hammaddeyi Düzenle"}</span>
      <button class="btn btn-ghost btn-sm" data-kapat>✕</button>
    </div>
    <label class="alan"><span>Hammadde adı</span><input type="text" id="h-ad" value="${kacir(h.ad)}" placeholder="Örn. Un (Tip 550)"></label>
    <div class="alan-grid">
      <label class="alan"><span>Alış birimi</span>
        <select id="h-birim">
          <option value="kg" ${h.birim==="kg"?"selected":""}>kg (ağırlık)</option>
          <option value="lt" ${h.birim==="lt"?"selected":""}>lt (hacim)</option>
          <option value="adet" ${h.birim==="adet"?"selected":""}>adet</option>
        </select>
      </label>
      <label class="alan"><span>Birim fiyat (₺)</span><input type="number" step="any" id="h-fiyat" value="${num(h.fiyat)}"></label>
      <label class="alan"><span>Fire / zayiat (%)</span><input type="number" step="any" id="h-fire" value="${num(h.fire)}"></label>
      <label class="alan"><span>Tedarikçi</span><input type="text" id="h-ted" value="${kacir(h.tedarikci||"")}"></label>
    </div>
    <div style="font-size:11.5px;color:var(--text-3);line-height:1.5">
      Fiyat KDV hariç, alış birimi başına girilir. Fire oranı; depolama, dökülme ve
      ölçüm kaybını karşılar — reçetede bu oran kadar fazlası maliyete yazılır.
    </div>
    <div class="modal-alt">
      <button class="btn btn-ghost" data-kapat>Vazgeç</button>
      <button class="btn" id="h-kaydet">Kaydet</button>
    </div>
  `, ov => {
    ov.querySelector("#h-kaydet").addEventListener("click", () => {
      h.ad = ov.querySelector("#h-ad").value.trim();
      h.birim = ov.querySelector("#h-birim").value;
      h.fiyat = num(ov.querySelector("#h-fiyat").value);
      h.fire = num(ov.querySelector("#h-fire").value);
      h.tedarikci = ov.querySelector("#h-ted").value.trim();
      if(!h.ad){ alert("Hammadde adı gerekli."); return; }
      const i = DB.hammadde.findIndex(x => x.id === h.id);
      if(i >= 0) DB.hammadde[i] = h; else DB.hammadde.push(h);
      kaydet(); ov.remove(); ciz();
    });
  });
}

/* Excel'den kopyalanan satırları toplu ekler: Ad | Birim | Fiyat | Fire | Tedarikçi */
function hammaddeToplu(){
  modalAc(`
    <div class="modal-baslik">
      <span>Toplu Hammadde Ekle</span>
      <button class="btn btn-ghost btn-sm" data-kapat>✕</button>
    </div>
    <div style="font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:10px">
      Excel'den kopyalayıp yapıştırın. Her satır bir hammadde, sütunlar sekme veya
      noktalı virgül ile ayrılmış olmalı:<br>
      <b>Ad · Birim (kg/lt/adet) · Birim fiyat · Fire % · Tedarikçi</b><br>
      Son iki sütun boş bırakılabilir. Aynı adlı hammadde varsa fiyatı güncellenir.
    </div>
    <textarea id="t-alan" placeholder="Un (Tip 550)&#9;kg&#9;18,50&#9;2&#9;Söke
Tereyağı&#9;kg&#9;385&#9;1
Yumurta&#9;adet&#9;4,25"></textarea>
    <div class="modal-alt">
      <button class="btn btn-ghost" data-kapat>Vazgeç</button>
      <button class="btn" id="t-uygula">Ekle</button>
    </div>
  `, ov => {
    ov.querySelector("#t-uygula").addEventListener("click", () => {
      const satirlar = ov.querySelector("#t-alan").value.split("\n").map(s => s.trim()).filter(Boolean);
      let eklendi = 0, guncellendi = 0, atlandi = 0;
      satirlar.forEach(s => {
        const p = s.split(/\t|;/).map(x => x.trim());
        const ad = p[0];
        if(!ad){ atlandi++; return; }
        let birim = (p[1]||"kg").toLocaleLowerCase("tr");
        if(!BIRIMLER[birim]) birim = "kg";
        const fiyat = num(p[2]);
        const fire = num(p[3]);
        const ted = p[4] || "";
        const mevcut = DB.hammadde.find(h => h.ad.toLocaleLowerCase("tr") === ad.toLocaleLowerCase("tr"));
        if(mevcut){
          mevcut.birim = birim; mevcut.fiyat = fiyat;
          if(p[3] !== undefined) mevcut.fire = fire;
          if(ted) mevcut.tedarikci = ted;
          guncellendi++;
        }else{
          DB.hammadde.push({id:yeniId(), ad, birim, fiyat, fire, tedarikci:ted});
          eklendi++;
        }
      });
      kaydet(); ov.remove(); ciz();
      alert(`${eklendi} hammadde eklendi, ${guncellendi} tanesi güncellendi${atlandi?`, ${atlandi} satır atlandı`:""}.`);
    });
  });
}

function hammaddeCsv(){
  csvIndir(`hammaddeler-${bugun()}.csv`,
    ["Hammadde","Birim","Birim Fiyat","Fire %","Fireli Birim Fiyat","Tedarikçi"],
    DB.hammadde.map(h => [h.ad, h.birim, num(h.fiyat), num(h.fire), (num(h.fiyat)*(1+num(h.fire)/100)).toFixed(4), h.tedarikci||""]));
}

        ${a.genelYontem === "dakika" ? `
          <div class="alan-grid">
            <label class="alan"><span>Aylık toplam genel gider (₺)</span><input type="number" step="any" id="s-gg" value="${num(a.aylikGenelGider)}"></label>
            <label class="alan"><span>Aylık toplam üretim süresi (dk)</span><input type="number" step="any" id="s-dk" value="${num(a.aylikUretimDk)}"></label>
          </div>
          <div style="font-size:12.5px;color:var(--text-2);padding:9px 12px;background:var(--paper);border-radius:9px;">
            Dakika başına genel gider: <b class="tabular">${tl(dkBasi, 3)}</b>
            ${dkBasi ? "" : ` <span style="color:var(--expense)">— iki alanı da doldurun, yoksa genel gider sıfır sayılır.</span>`}
          </div>` : `
          <div class="alan-grid">
            <label class="alan"><span>Hammadde üzerine eklenecek (%)</span><input type="number" step="any" id="s-yuzde" value="${num(a.genelYuzde)}"></label>
          </div>
          <div style="font-size:11.5px;color:var(--text-3);line-height:1.5">
            Basit yöntem: her ürünün hammadde maliyetine bu oran eklenir. Emek yoğun ve
            hızlı üretilen ürünleri aynı sayar; kesin sonuç için dakika yöntemini kullanın.
          </div>`}
      </div>
    </div>

    <div class="card">
      <div class="card-head">Fiyatlandırma</div>
      <div class="card-body">
        <div class="alan-grid">
          <label class="alan"><span>Varsayılan atölye kâr marjı (%)</span><input type="number" step="any" id="s-marj" value="${num(a.varsayilanMarj)}"></label>
        </div>
        <div style="font-size:12.5px;color:var(--text-2);padding:9px 12px;background:var(--paper);border-radius:9px;line-height:1.6">
          Marj <b>maliyet üzerine</b> eklenir; mağaza rafı fiyatı atölye fiyatının
          sabit ${sayi(MAGAZA_CARPANI,2)} katıdır. 10 ₺ maliyetli bir üründe %${sayi(num(a.varsayilanMarj),0)} ile:
          <br>maliyet 10,00 ₺ → atölye ${tl(10*(1+num(a.varsayilanMarj)/100))} → mağaza ${tl(10*(1+num(a.varsayilanMarj)/100)*MAGAZA_CARPANI)}
        </div>
        <div style="font-size:11.5px;color:var(--text-3);line-height:1.5;margin-top:8px">
          Reçetede ayrı marj girilirse o geçerlidir.
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">Veri <span class="hint">${DB.urun.length} reçete · ${DB.hammadde.length} hammadde</span></div>
      <div class="card-body">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" id="s-yedek">⬇ Tam Yedek (JSON)</button>
          <button class="btn btn-ghost btn-sm" id="s-geri">⬆ Yedekten Geri Yükle</button>
          <button class="btn btn-danger btn-sm" id="s-temizle">Başlangıç Verisine Dön</button>
        </div>
        <div style="font-size:11.5px;color:var(--text-3);line-height:1.5;margin-top:10px">
          Veriler yalnızca bu tarayıcıda saklanır. Başka bilgisayarda kullanmak veya
          geçmişi korumak için düzenli yedek alın.
        </div>
      </div>
    </div>`;

  const bagla = (id, alan) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("change", () => { DB.ayar[alan] = num(el.value); kaydet(); ciz(); });
  };
  bagla("s-isci","isciSaat"); bagla("s-gg","aylikGenelGider");
  bagla("s-dk","aylikUretimDk"); bagla("s-yuzde","genelYuzde");
  bagla("s-marj","varsayilanMarj");

  document.querySelectorAll("[data-yontem]").forEach(b => b.addEventListener("click", () => {
    DB.ayar.genelYontem = b.dataset.yontem; kaydet(); ciz();
  }));
  document.getElementById("s-yedek").addEventListener("click", () => {
    dosyaIndir(`maliyet-yedek-${bugun()}.json`, JSON.stringify(DB, null, 2));
  });
  document.getElementById("s-geri").addEventListener("click", geriYukle);
  document.getElementById("s-temizle").addEventListener("click", () => {
    if(!confirm("Yaptığınız tüm değişiklikler silinip Excel'den aktarılan başlangıç verisine dönülecek. Emin misiniz?")) return;
    if(!confirm("Son onay: bu işlem geri alınamaz. Yedeğiniz var mı?")) return;
    DB = JSON.parse(JSON.stringify(BASLANGIC)); kaydet(); ciz();
  });
}

function geriYukle(){
  modalAc(`
    <div class="modal-baslik"><span>Yedekten Geri Yükle</span>
      <button class="btn btn-ghost btn-sm" data-kapat>✕</button></div>
    <div style="font-size:12.5px;color:var(--text-2);margin-bottom:10px">
      Daha önce indirdiğiniz JSON yedeğinin içeriğini buraya yapıştırın.
      Mevcut veriler <b>tamamen değiştirilir</b>.
    </div>
    <textarea id="y-alan" placeholder='{"hammadde":[…],"urun":[…],"ayar":{…}}'></textarea>
    <div class="modal-alt">
      <button class="btn btn-ghost" data-kapat>Vazgeç</button>
      <button class="btn" id="y-uygula">Geri Yükle</button>
    </div>
  `, ov => {
    ov.querySelector("#y-uygula").addEventListener("click", () => {
      let v;
      try{ v = JSON.parse(ov.querySelector("#y-alan").value); }
      catch(e){ alert("Geçerli bir JSON değil."); return; }
      if(!v || !Array.isArray(v.urun) || !Array.isArray(v.hammadde)){ alert("Yedek dosyası tanınmadı."); return; }
      const kayitliAyar = v.ayar || {};
      goceAyar(kayitliAyar);              // eski katsayılı yedekler de açılsın
      v.urun.forEach(goceUrun);
      DB = {hammadde:v.hammadde, urun:v.urun, ayar:Object.assign({}, VARSAYILAN.ayar, kayitliAyar)};
      kaydet(); ov.remove(); ciz();
      alert("Yedek geri yüklendi.");
    });
  });
}

/* ---------------- Modal & dosya ---------------- */
function modalAc(html, hazir){
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  ov.innerHTML = `<div class="modal-kutu">${html}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", e => { if(e.target === ov) ov.remove(); });
  ov.querySelectorAll("[data-kapat]").forEach(b => b.addEventListener("click", () => ov.remove()));
  if(hazir) hazir(ov);
  return ov;
}

function csvIndir(dosyaAdi, basliklar, satirlar){
  const hucre = v => {
    const s = String(v == null ? "" : v);
    return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const metin = "﻿" + [basliklar, ...satirlar].map(r => r.map(hucre).join(";")).join("\n");
  dosyaIndir(dosyaAdi, metin);
}

/* İndirme iki ortamda farklı çalışır:
   - Dosyadan/sunucudan açıldığında tarayıcının kendi indirmesi,
   - claude.ai'de yayınlanmış sayfada tarayıcı indirmesi engellidir; oradaki
     "downloads" yetkisi dosyayı izleyicinin onayıyla kaydeder.
   İkisi de yoksa içerik kopyalanabilir şekilde ekranda gösterilir. */
let indirmeKapisi;   // undefined = henüz çözülmedi, null = yok
async function indirmeKapisiCoz(){
  if(indirmeKapisi !== undefined) return indirmeKapisi;
  try{
    indirmeKapisi = (window.claude && typeof claude.use === "function")
      ? await claude.use("downloads") : null;
  }catch(e){ indirmeKapisi = null; }
  return indirmeKapisi;
}
// Yayınlanmış sayfada yetki çözümü saniyeler sürebilir; peşinen başlat.
indirmeKapisiCoz();

function icerikGoster(dosyaAdi, icerik, aciklama){
  modalAc(`
    <div class="modal-baslik"><span>${kacir(dosyaAdi)}</span>
      <button class="btn btn-ghost btn-sm" data-kapat>✕</button></div>
    <div style="font-size:12.5px;color:var(--text-2);margin-bottom:8px">${aciklama}</div>
    <textarea readonly>${kacir(icerik)}</textarea>
    <div class="modal-alt">
      <button class="btn btn-ghost" id="ig-kopyala">Panoya Kopyala</button>
      <button class="btn" data-kapat>Kapat</button>
    </div>`, ov => {
    ov.querySelector("#ig-kopyala").addEventListener("click", async e => {
      try{
        await navigator.clipboard.writeText(icerik);
        e.target.textContent = "Kopyalandı ✓";
      }catch(err){
        const ta = ov.querySelector("textarea");
        ta.focus(); ta.select();
        e.target.textContent = "Ctrl/Cmd+C ile kopyalayın";
      }
    });
  });
}

async function dosyaIndir(dosyaAdi, icerik){
  const kapi = await indirmeKapisiCoz();
  if(kapi){
    try{
      await kapi.save({filename:dosyaAdi, data:icerik});
    }catch(e){
      if(e && e.code === "declined") return;          // izleyici vazgeçti
      if(e && e.code === "rate_limited"){
        alert("Bir indirme onayı zaten açık. Onu tamamlayıp tekrar deneyin.");
        return;
      }
      icerikGoster(dosyaAdi, icerik, "Dosya kaydedilemedi. İçeriği kopyalayıp bir dosyaya yapıştırabilirsiniz.");
    }
    return;
  }
  try{
    const blob = new Blob([icerik], {type:"text/plain;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = dosyaAdi;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){
    icerikGoster(dosyaAdi, icerik, "İndirme engellendi. İçeriği kopyalayıp bir dosyaya yapıştırın.");
  }
}

/* ---------------- Başlat ---------------- */
ciz();
</script>
